---
# role: freeradius
# file: defaults/main.yml

# IPv4 address of the UDP authentication listener.
freeradius_listen_address: 127.0.0.1

# UDP authentication port, from 1 to 65535.
freeradius_port: 1812

# Enable the UDP accounting listener for the configured clients.
freeradius_accounting_enabled: false

# UDP port for accounting requests on freeradius_listen_address.
freeradius_accounting_port: 1813

# Store detail records locally or drain them into PostgreSQL asynchronously.
# Choices: detail, postgresql
freeradius_accounting_backend: detail

# PostgreSQL hostname required when the accounting backend is postgresql.
# freeradius_postgresql_host: radius-db.example.net

# PostgreSQL server port.
freeradius_postgresql_port: 5432

# Existing PostgreSQL database containing the FreeRADIUS schema.
freeradius_postgresql_database: radius

# Existing restricted PostgreSQL login used by the running RADIUS service.
freeradius_postgresql_user: radius

# PostgreSQL password required when the accounting backend is postgresql.
# freeradius_postgresql_password: "{{ vault_radius_postgresql_password }}"

# TLS verification policy for the PostgreSQL connection.
# Choices: disable, require, verify-ca, verify-full
freeradius_postgresql_ssl_mode: verify-full

# Optional CA certificate path on the RADIUS host; undefined uses the libpq default.
# freeradius_postgresql_ssl_root_cert: /etc/ssl/certs/radius-db-ca.pem

# Initialize the distribution schema and runtime grants using separate owner credentials.
freeradius_postgresql_initialize_schema: false

# Existing database/schema owner required only for schema initialization and grants.
# freeradius_postgresql_schema_user: radius_owner

# Owner password used by Ansible only; never written to the RADIUS configuration.
# freeradius_postgresql_schema_password: "{{ vault_radius_schema_password }}"

# Maximum recent open SQL sessions per local PAP user; zero disables admission checks.
freeradius_simultaneous_use: 0

# Maximum age in seconds of the last accounting update counted toward the PAP session limit.
freeradius_simultaneous_use_max_age: 900

# Authoritative RADIUS clients, all requiring Message-Authenticator.
freeradius_clients: []
# - name: access_switch
#   address: 192.0.2.20
#   secret: "{{ vault_radius_client_secret }}"
#   services: [vpn, mab, eap_tls]
#   mab_service_type: Call-Check

# Default FreeRADIUS attribute for local PAP credentials.
# Choices: Crypt-Password, PBKDF2-Password, SSHA2-512-Password, NT-Password, Cleartext-Password
freeradius_password_attribute: Crypt-Password

# Authoritative local PAP users with credentials and optional attribute overrides.
freeradius_users: []
# - name: alice
#   password: "{{ vault_radius_alice_password_hash }}"
#   password_attribute: Crypt-Password
#   access:
#     - {client: access_switch, profile: vpn_staff}

# Enforce client services for VPN, MAB and EAP-TLS, plus VPN profile grants for PAP.
freeradius_authorization_enabled: false

# Named VPN and MAB reply profiles referencing existing NAS resources.
freeradius_access_profiles: []
# - name: vpn_staff
#   service: vpn
#   mikrotik_group: vpn-staff
#   framed_pool: vpn-pool
#   filter_id: vpn-filter
#   session_timeout: 3600
#   reauthenticate: false
# - name: printers
#   service: mab
#   vlan_id: 100

# Enable MAC admission on explicitly permitted NAS clients; requires authorization.
freeradius_mab_enabled: false

# MAC devices with at most one profile grant per configured NAS client.
freeradius_mab_devices: []
# - mac: '00:11:22:33:44:55'
#   access:
#     - {client: access_switch, profile: printers}

# MAB profile for devices without a grant, required when MAC admission is enabled.
# freeradius_mab_quarantine_profile: quarantine

# Maximum attempts per local user before rejecting further requests until expiry.
freeradius_failure_limit: 5

# Fixed PAP attempt window in seconds, reset by successful PAP authentication.
freeradius_failure_window: 300

# Enable certificate-only EAP-TLS alongside local PAP authentication.
freeradius_eap_tls_enabled: false

# Optional OpenSSL TLS 1.2 cipher list; undefined uses the OS-specific default.
# freeradius_eap_tls_cipher_list: ECDHE+AESGCM:ECDHE+CHACHA20

# Server certificate chain in PEM format on the RADIUS host, required for EAP-TLS.
# freeradius_eap_tls_certificate_file: /etc/radius-pki/server.pem

# PEM private key on the RADIUS host, required for EAP-TLS.
# freeradius_eap_tls_private_key_file: /etc/radius-pki/server.key

# Password for an encrypted server private key; empty selects an unencrypted key.
freeradius_eap_tls_private_key_password: ''

# Trusted client CA bundle on the RADIUS host, required for EAP-TLS.
# freeradius_eap_tls_ca_file: /etc/radius-pki/ca.pem

# Exact client issuer DN in OpenSSL compat format, required for EAP-TLS.
# freeradius_eap_tls_issuer: /O=Example/CN=Device CA

# Certificate revocation policy; CRL and OCSP failures deny authentication.
# Choices: crl, ocsp, none
freeradius_eap_tls_revocation: crl

# OpenSSL-rehashed CA and CRL directory on the RADIUS host, required for crl.
freeradius_eap_tls_ca_path: ''

# Explicit HTTP OCSP responder URL, required for ocsp.
freeradius_eap_tls_ocsp_url: ''

# Certificate policy OIDs mapped to VLAN IDs; exactly one mapping must match.
freeradius_eap_tls_vlan_policies: []
# - oid: '1.3.6.1.4.1.32473.1'
#   vlan_id: 100

# Back up managed configuration, including any credentials it contains.
freeradius_backup: false
