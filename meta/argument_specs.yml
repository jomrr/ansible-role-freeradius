---
# role: freeradius
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Configure FreeRADIUS clients, PAP users, EAP-TLS certificate policies
      and accounting.
    options:
      freeradius_listen_address:
        type: str
        default: 127.0.0.1
        description: IPv4 address on which to accept authentication and enabled accounting
          requests.
      freeradius_port:
        type: int
        default: 1812
        description: UDP authentication port, from 1 to 65535.
      freeradius_clients:
        type: list
        elements: dict
        default: []
        description: Authoritative clients for authentication and accounting; Access-Request
          requires Message-Authenticator.
        options:
          name:
            type: str
            required: true
            description: Unique client identifier containing letters, digits, underscores
              or hyphens.
          address:
            type: str
            required: true
            description: IPv4 address or CIDR network permitted to send RADIUS requests;
              /0 is forbidden.
          secret:
            type: str
            required: true
            no_log: true
            description: Unique shared secret of 16 to 128 characters; letters, digits and
              ._~!@#%^&*+=:/?- are accepted.
      freeradius_password_attribute:
        type: str
        default: Crypt-Password
        choices:
          - Crypt-Password
          - PBKDF2-Password
          - SSHA2-512-Password
          - NT-Password
          - Cleartext-Password
        description: Default FreeRADIUS credential attribute; PAP permits hashes without
          requiring cleartext storage.
      freeradius_users:
        type: list
        elements: dict
        default: []
        description: Authoritative local PAP users; an empty list disables PAP without affecting
          EAP-TLS.
        options:
          name:
            type: str
            required: true
            description: Unique username containing letters, digits, dots, underscores,
              at signs or hyphens; DEFAULT is reserved.
          password:
            type: str
            required: true
            no_log: true
            description: Credential matching password_attribute; hashes are the default
              and cleartext requires explicit selection.
          password_attribute:
            type: str
            choices:
              - Crypt-Password
              - PBKDF2-Password
              - SSHA2-512-Password
              - NT-Password
              - Cleartext-Password
            description: Optional per-user override of freeradius_password_attribute.
      freeradius_failure_limit:
        type: int
        default: 5
        description: Maximum admitted PAP attempts per local user in a fixed window, from
          1 to 1000; success resets the counter.
      freeradius_failure_window:
        type: int
        default: 300
        description: Fixed attempt window in seconds, from 10 to 86400; blocked requests
          do not extend it.
      freeradius_backup:
        type: bool
        default: false
        description: Back up managed configuration before replacement; backups can contain
          credentials.
      freeradius_accounting_enabled:
        type: bool
        default: false
        description: Enable accounting for the configured clients on freeradius_listen_address.
      freeradius_accounting_port:
        type: int
        default: 1813
        description: UDP accounting port, from 1 to 65535; must differ from the authentication
          port.
      freeradius_accounting_backend:
        type: str
        default: detail
        choices:
          - detail
          - postgresql
        description: Keep local detail records or drain them into PostgreSQL; postgresql
          requires accounting enabled.
      freeradius_postgresql_host:
        type: str
        description: PostgreSQL hostname or IP address; required for the postgresql backend.
      freeradius_postgresql_port:
        type: int
        default: 5432
        description: PostgreSQL TCP port, from 1 to 65535.
      freeradius_postgresql_database:
        type: str
        default: radius
        description: Existing database containing the distribution FreeRADIUS schema; letters,
          digits, underscores or hyphens.
      freeradius_postgresql_user:
        type: str
        default: radius
        description: Database identity; letters, digits, underscores or hyphens.
      freeradius_postgresql_password:
        type: str
        no_log: true
        description: Required for postgresql; 16 to 128 characters from the same alphabet
          as client secrets.
      freeradius_postgresql_ssl_mode:
        type: str
        default: verify-full
        choices:
          - disable
          - require
          - verify-ca
          - verify-full
        description: PostgreSQL TLS policy; verify-full verifies the certificate and hostname.
      freeradius_postgresql_ssl_root_cert:
        type: path
        default: ''
        description: Absolute CA certificate path on the RADIUS host; empty uses the libpq
          default.
      freeradius_postgresql_initialize_schema:
        type: bool
        default: false
        description: Import the packaged schema when public.radacct is absent; requires
          an existing empty database and CREATE rights.
      freeradius_simultaneous_use:
        type: int
        default: 0
        description: Open SQL sessions allowed per local PAP user; zero disables checking,
          positive values require postgresql.
      freeradius_eap_tls_enabled:
        type: bool
        default: false
        description: Enable certificate-only EAP-TLS with TLS 1.2 or 1.3 alongside local
          PAP; requires FreeRADIUS 3.2 or newer.
      freeradius_eap_tls_certificate_file:
        type: path
        description: Required for EAP-TLS; absolute PEM server certificate chain path on
          the RADIUS host.
      freeradius_eap_tls_private_key_file:
        type: path
        description: Required for EAP-TLS; absolute PEM server private key path on the RADIUS
          host, readable by the service account.
      freeradius_eap_tls_private_key_password:
        type: str
        default: ''
        no_log: true
        description: Private key password; empty for an unencrypted key. Letters, digits
          and ._~!@#^&*+=:/?- are accepted.
      freeradius_eap_tls_ca_file:
        type: path
        description: Required for EAP-TLS; absolute PEM client CA bundle path on the RADIUS
          host.
      freeradius_eap_tls_issuer:
        type: str
        description: Required for EAP-TLS; exact client issuer DN in OpenSSL compat format,
          such as /O=Example/CN=Device CA.
      freeradius_eap_tls_revocation:
        type: str
        default: crl
        choices:
          - crl
          - ocsp
          - none
        description: Certificate revocation policy; crl and ocsp reject unavailable or invalid
          revocation information.
      freeradius_eap_tls_ca_path:
        type: path
        default: ''
        description: Required for crl; absolute OpenSSL-rehashed CA and CRL directory, refreshed
          by FreeRADIUS every 300 seconds.
      freeradius_eap_tls_ocsp_url:
        type: str
        default: ''
        description: Required for ocsp; explicit HTTP responder URL. Signed responses and
          nonces are required; timeout is five seconds.
      freeradius_eap_tls_vlan_policies:
        type: list
        elements: dict
        default: []
        description: Required nonempty for EAP-TLS; exactly one policy must match. Certificate
          policies with qualifiers are rejected.
        options:
          oid:
            type: str
            required: true
            description: Unique numeric certificate policy OID, matched as a complete value.
          vlan_id:
            type: int
            required: true
            description: VLAN ID from 1 to 4094 returned in the standard RADIUS tunnel attributes.
