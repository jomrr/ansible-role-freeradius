---
# role: freeradius
# file: molecule/resources/tasks/authenticate.yml

- name: FREERADIUS | Send valid authentication request
  ansible.builtin.command:
    argv:
      - radclient
      - -x
      - -r
      - '3'
      - -t
      - '3'
      - "127.0.0.1:{{ __freeradius_test_port }}"
      - auth
      - "{{ __freeradius_test_secret }}"
    stdin: |
      User-Name = "{{ __freeradius_test_username | default('molecule') }}"
      User-Password = "{{ __freeradius_test_password }}"
      Message-Authenticator = 0x00
  changed_when: false
  failed_when: false
  register: __freeradius_accept

- name: FREERADIUS | Verify admission response
  ansible.builtin.assert:
    that:
      - (__freeradius_expected_auth_response | default('Access-Accept')) in __freeradius_accept.stdout
    fail_msg: "{{ __freeradius_accept.stdout }} {{ __freeradius_accept.stderr }}"
    quiet: true

- name: FREERADIUS | Send invalid authentication request
  ansible.builtin.command:
    argv:
      - radclient
      - -x
      - -r
      - '3'
      - -t
      - '3'
      - "127.0.0.1:{{ __freeradius_test_port }}"
      - auth
      - "{{ __freeradius_test_secret }}"
    stdin: |
      User-Name = "{{ __freeradius_test_username | default('molecule') }}"
      User-Password = "{{ __freeradius_rejected_password }}"
      Message-Authenticator = 0x00
  changed_when: false
  failed_when: false
  register: __freeradius_reject

- name: FREERADIUS | Verify Access-Reject
  ansible.builtin.assert:
    that:
      - "'Access-Reject' in __freeradius_reject.stdout"
    fail_msg: "{{ __freeradius_reject.stdout }} {{ __freeradius_reject.stderr }}"
    quiet: true
