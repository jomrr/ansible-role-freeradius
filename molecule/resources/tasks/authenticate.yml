---
# role: freeradius
# file: molecule/resources/tasks/authenticate.yml

- name: FREERADIUS | Verify authentication batches with native response filters
  # Native filters match the whole reply; Reject permits only Message-Authenticator.
  # File descriptors keep packet/filter pairs together without temporary fixture files.
  ansible.builtin.shell: |
    radclient -x -s -r 3 -t 3 -p 1 -f /dev/fd/3:/dev/fd/4 \
      127.0.0.1 auth {{ __freeradius_auth_batch.grouper | quote }} 3<<'REQUESTS' 4<<'RESPONSES'
    {% for __freeradius_auth_case in __freeradius_auth_batch.list %}
    User-Name = {{ __freeradius_auth_case.username | default('molecule') | to_json }}
    User-Password = {{ __freeradius_auth_case.password | to_json }}
    Message-Authenticator = 0x00
    Packet-Dst-Port = {{ __freeradius_auth_case.port | default(1812) }}
    Packet-Src-IP-Address = {{ __freeradius_auth_case.source | default('127.0.0.1') }}
    {% for __freeradius_attribute in __freeradius_auth_case.attributes |
      default({'Service-Type': 'Framed-User', 'Framed-Protocol': 'PPP'}) | dict2items %}
    {{ __freeradius_attribute.key }} = {{ __freeradius_attribute.value | to_json }}
    {% endfor %}

    {% endfor %}
    REQUESTS
    {% for __freeradius_auth_case in __freeradius_auth_batch.list %}
    Response-Packet-Type == {{ __freeradius_auth_case.response | default('Access-Accept') }}
    Message-Authenticator =* 0x00
    {% if __freeradius_auth_case.response | default('Access-Accept') == 'Access-Accept' %}
    {% for __freeradius_reply in __freeradius_auth_case.reply |
      default((__freeradius_access_matrix | selectattr('name', 'equalto', 'vpn_profile') | first).reply) %}
    {{ __freeradius_reply | replace(' = ', ' == ') }}
    {% endfor %}
    {% endif %}

    {% endfor %}
    RESPONSES
  args:
    executable: /bin/bash
  loop: "{{ __freeradius_auth_cases | groupby('secret', default='molecule-radius-secret-2026', case_sensitive=true) }}"
  loop_control:
    loop_var: __freeradius_auth_batch
    label: "{{ __freeradius_auth_batch.list | length }} requests from {{ __freeradius_auth_batch.list[0].source | default('127.0.0.1') }}"
    break_when: __freeradius_auth_result is failed
  changed_when: false
  register: __freeradius_auth_result
