---
# role: freeradius
# file: molecule/resources/tasks/accounting_detail.yml

- name: FREERADIUS | Send local accounting lifecycle
  ansible.builtin.include_tasks: accounting.yml
  loop: [Start, Interim-Update, Stop]
  loop_control:
    loop_var: __freeradius_test_acct_status
  vars:
    __freeradius_test_acct_session: detail-lifecycle
    __freeradius_test_acct_port: 11813
    __freeradius_test_acct_secret: molecule-rotated-secret-2026

- name: FREERADIUS | Find local detail records
  become: true
  become_user: root
  ansible.builtin.find:
    paths: "{{ __freeradius_log_dir }}/ansible-accounting"
    patterns: detail-????????
  register: __freeradius_detail_files

- name: FREERADIUS | Verify private accounting records exist
  ansible.builtin.assert:
    that:
      - __freeradius_detail_files.matched > 0
      - __freeradius_detail_files.files | map(attribute='mode') | unique | list == ['0600']
      - __freeradius_detail_files.files | map(attribute='pw_name') | unique | list == [__freeradius_user]
    quiet: true

- name: FREERADIUS | Read stored accounting records
  become: true
  become_user: root
  ansible.builtin.slurp:
    src: "{{ __freeradius_detail_files.files[0].path }}"
  register: __freeradius_detail_records

- name: FREERADIUS | Verify stable session identifier and stored events
  ansible.builtin.assert:
    that:
      - "'detail-lifecycle' in (__freeradius_detail_records.content | b64decode)"
      - "'Acct-Status-Type = Start' in (__freeradius_detail_records.content | b64decode)"
      - "'Acct-Status-Type = Interim-Update' in (__freeradius_detail_records.content | b64decode)"
      - "'Acct-Status-Type = Stop' in (__freeradius_detail_records.content | b64decode)"
      - >-
        (__freeradius_detail_records.content | b64decode |
         regex_findall('Acct-Unique-Session-Id = "?([a-f0-9]{32})') | unique | length) == 1
    quiet: true

- name: FREERADIUS | Preserve detail data before injecting an open failure
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - mv
      - "{{ __freeradius_detail_files.files[0].path }}"
      - "{{ __freeradius_detail_files.files[0].path }}.saved"
  changed_when: true

- name: FREERADIUS | Exercise a failed detail file open
  block:
    - name: FREERADIUS | Replace the detail file with a directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __freeradius_detail_files.files[0].path }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: FREERADIUS | Close cached detail file descriptors
      become: true
      become_user: root
      ansible.builtin.service:
        name: "{{ __freeradius_service }}"
        state: restarted

    - name: FREERADIUS | Verify failed detail writes are not acknowledged
      ansible.builtin.include_tasks: accounting.yml
      vars:
        __freeradius_test_acct_session: failed-write
        __freeradius_test_acct_port: 11813
        __freeradius_test_acct_secret: molecule-rotated-secret-2026
        __freeradius_test_acct_response: No reply from server

  always:
    - name: FREERADIUS | Remove the injected directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __freeradius_detail_files.files[0].path }}"
        state: absent

    - name: FREERADIUS | Restore original detail data
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - mv
          - "{{ __freeradius_detail_files.files[0].path }}.saved"
          - "{{ __freeradius_detail_files.files[0].path }}"
      changed_when: true

- name: FREERADIUS | Verify retry succeeds after storage recovery
  ansible.builtin.include_tasks: accounting.yml
  vars:
    __freeradius_test_acct_session: failed-write
    __freeradius_test_acct_port: 11813
    __freeradius_test_acct_secret: molecule-rotated-secret-2026
