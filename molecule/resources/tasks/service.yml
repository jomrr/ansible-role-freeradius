---
# role: freeradius
# file: molecule/resources/tasks/service.yml

- name: FREERADIUS | Load platform settings for verification
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"

- name: FREERADIUS | Read service state
  ansible.builtin.service_facts:

- name: FREERADIUS | Verify service is running and enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services[__freeradius_service + '.service'].state == 'running'
      - ansible_facts.services[__freeradius_service + '.service'].status == 'enabled'
    quiet: true

- name: FREERADIUS | Inspect credential file permissions
  become: true
  become_user: root
  ansible.builtin.stat:
    path: "{{ __freeradius_config_dir }}/{{ __freeradius_file }}"
  loop:
    - radiusd.conf
    - ansible-users
  loop_control:
    loop_var: __freeradius_file
  register: __freeradius_permissions

- name: FREERADIUS | Verify credentials are protected
  ansible.builtin.assert:
    that:
      - __freeradius_permission.stat.mode == '0640'
      - __freeradius_permission.stat.pw_name == 'root'
      - __freeradius_permission.stat.gr_name == __freeradius_group
    quiet: true
  loop: "{{ __freeradius_permissions.results }}"
  loop_control:
    loop_var: __freeradius_permission
    label: "{{ __freeradius_permission.stat.path }}"
