---
# role: freeradius
# file: molecule/resources/tasks/accounting.yml

- name: FREERADIUS | Send accounting cases and check each response
  ansible.builtin.command:
    argv:
      - radclient
      - -x
      - -r
      - '3'
      - -t
      - '1'
      - "127.0.0.1:{{ __freeradius_accounting_case.port | default(1813) }}"
      - acct
      - "{{ __freeradius_accounting_case.secret | default('molecule-radius-secret-2026') }}"
    stdin: |
      User-Name = "molecule"
      Acct-Status-Type = {{ __freeradius_accounting_case.status | default('Start') }}
      Acct-Session-Id = "{{ __freeradius_accounting_case.session }}"
      NAS-Identifier = "molecule"
      NAS-Port = 1
      Acct-Session-Time = 60
      Acct-Input-Octets = 1234
      Acct-Input-Gigawords = 1
      Acct-Output-Octets = 5678
      Acct-Delay-Time = 10
      {% if __freeradius_accounting_case.timestamp is defined %}
      Event-Timestamp = {{ __freeradius_accounting_case.timestamp }}
      {% endif %}
      {{ 'NAS-IP-Address = 127.0.0.1' if __freeradius_accounting_case.send_nas_address | default(true) else '' }}
  loop: "{{ __freeradius_accounting_cases }}"
  loop_control:
    loop_var: __freeradius_accounting_case
    label: "{{ __freeradius_accounting_case.session }} / {{ __freeradius_accounting_case.status | default('Start') }}"
    break_when: __freeradius_accounting_result is failed
  changed_when: false
  failed_when: >-
    (__freeradius_accounting_case.response | default('Accounting-Response'))
    not in __freeradius_accounting_result.stdout
  register: __freeradius_accounting_result
