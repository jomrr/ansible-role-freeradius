---
# role: freeradius
# file: molecule/resources/playbooks/prepare.yml

- name: FREERADIUS | Prepare protocol tests
  hosts: radius_servers
  gather_facts: true
  vars:
    __freeradius_test_packages:
      Debian: freeradius-utils
      RedHat: freeradius-utils
      Suse: freeradius-server-utils
    __freeradius_eap_test_packages:
      Debian: eapoltest
      RedHat: wpa_supplicant
      Suse: wpa_supplicant
    __freeradius_timezone_packages:
      Debian: tzdata
      RedHat: tzdata
      Suse: timezone
  tasks:
    - name: FREERADIUS | Refresh APT package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: FREERADIUS | Load certificate fixture ownership
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"

    - name: FREERADIUS | Install RADIUS protocol test client
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - "{{ __freeradius_test_packages[ansible_facts.os_family] }}"
          - python3-psycopg2
          - "{{ __freeradius_eap_test_packages[ansible_facts.os_family] }}"
          - "{{ __freeradius_packages[0] }}"
          - "{{ __freeradius_timezone_packages[ansible_facts.os_family] }}"
          - openssl
        state: present

    - name: FREERADIUS | Exercise accounting in a timezone with daylight saving
      become: true
      become_user: root
      community.general.timezone:
        name: Europe/Berlin

    - name: FREERADIUS | Generate temporary certificate authorities and client profiles
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: "../files/create-eap-fixtures {{ __freeradius_group }}"
        creates: /etc/freeradius-molecule-pki/ready
      when: freeradius_eap_tls_enabled

    - name: FREERADIUS | Prepare reusable certificate test supplicants
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/freeradius-molecule-pki/eap-{{ __freeradius_eap_fixture.profile }}.conf"
        mode: '0600'
        content: |
          network={
              key_mgmt=WPA-EAP
              eap=TLS
              phase1="{{ __freeradius_eap_fixture.phase1 | default('tls_disable_tlsv1_3=1') }}"
              identity="molecule"
              ca_cert="/etc/freeradius-molecule-pki/ca/cert.pem"
              domain_suffix_match="radius.example.test"
              client_cert="/etc/freeradius-molecule-pki/{{ __freeradius_eap_fixture.profile }}.pem"
              private_key="/etc/freeradius-molecule-pki/client.key"
          }
      loop: "{{ __freeradius_eap_fixtures }}"
      loop_control:
        loop_var: __freeradius_eap_fixture
        label: "{{ __freeradius_eap_fixture.profile }}"
      when: freeradius_eap_tls_enabled
  gather_subset:
    - min

- name: FREERADIUS | Prepare shared PostgreSQL logins through one RADIUS host
  hosts: radius_servers[0]
  gather_facts: false
  tasks:
    - name: FREERADIUS | Prepare PostgreSQL fixture for SQL accounting
      when: freeradius_accounting_enabled and freeradius_accounting_backend == 'postgresql'
      block:
        - name: FREERADIUS | Wait for database fixture
          ansible.builtin.wait_for:
            host: "{{ freeradius_postgresql_host }}"
            port: 5432
            timeout: 60

        - name: FREERADIUS | Create separate database owner and runtime fixture logins
          community.postgresql.postgresql_user:
            login_host: "{{ freeradius_postgresql_host }}"
            login_user: postgres
            login_password: molecule-postgresql-secret-2026
            login_db: postgres
            ssl_mode: disable
            name: "{{ __freeradius_database_login.name }}"
            password: "{{ __freeradius_database_login.password }}"
            role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOBYPASSRLS
          loop:
            - name: "{{ freeradius_postgresql_schema_user }}"
              password: "{{ freeradius_postgresql_schema_password }}"
            - name: "{{ freeradius_postgresql_user }}"
              password: "{{ freeradius_postgresql_password }}"
          loop_control:
            loop_var: __freeradius_database_login
            label: "{{ __freeradius_database_login.name }}"
          no_log: true

- name: FREERADIUS | Prepare isolated databases for all RADIUS platforms
  hosts: radius_servers
  gather_facts: false
  tasks:
    - name: FREERADIUS | Prepare PostgreSQL fixture for SQL accounting
      when: freeradius_accounting_enabled and freeradius_accounting_backend == 'postgresql'
      block:
        - name: FREERADIUS | Create isolated owner-controlled database for each platform
          community.postgresql.postgresql_db:
            login_host: "{{ freeradius_postgresql_host }}"
            login_user: postgres
            login_password: molecule-postgresql-secret-2026
            ssl_mode: disable
            name: "{{ freeradius_postgresql_database }}"
            owner: "{{ freeradius_postgresql_schema_user }}"
