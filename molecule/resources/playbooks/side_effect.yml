---
# role: freeradius
# file: molecule/resources/playbooks/side_effect.yml

- name: FREERADIUS | Gather platform context for configuration changes
  hosts: radius_servers
  gather_facts: true
  tasks:
    - name: FREERADIUS | Load RADIUS platform context
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"

- name: FREERADIUS | Coordinate database outage across the fixture and RADIUS hosts
  hosts: radius_servers:accounting_database
  gather_facts: false
# Keep fixture recovery after all RADIUS tasks, including failures.
  strategy: linear
  vars:
    freeradius_postgresql_initialize_schema: false
    freeradius_simultaneous_use_max_age: 600
  tasks:
    - name: FREERADIUS | Buffer requests while PostgreSQL is stopped
      block:
        - name: FREERADIUS | Stop database fixture
          containers.podman.podman_container:
            name: "{{ inventory_hostname }}"
            state: stopped
          delegate_to: localhost
          when: "'accounting_database' in group_names"

        - name: FREERADIUS | Exercise RADIUS admission during the shared database outage
          when: "'radius_servers' in group_names"
          block:
            - name: FREERADIUS | Restart RADIUS without a database connection
              become: true
              become_user: root
              ansible.builtin.service:
                name: "{{ __freeradius_service }}"
                state: restarted

            - name: FREERADIUS | Acknowledge accounting during database outage
              ansible.builtin.import_tasks: ../tasks/accounting.yml
              vars:
                __freeradius_accounting_cases:
                  - {session: outage-session}

            - name: FREERADIUS | Verify PAP remains available without a session limit
              ansible.builtin.import_tasks: ../tasks/authenticate.yml
              vars:
                __freeradius_auth_cases:
                  - {password: molecule-password}

            - name: FREERADIUS | Enable session admission while the database is unavailable
              ansible.builtin.include_role:
                name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
              vars:
                freeradius_simultaneous_use: 1

            - name: FREERADIUS | Verify admission cases for the current configuration
              ansible.builtin.import_tasks: ../tasks/authenticate.yml
              vars:
                __freeradius_auth_cases:
                  - {password: molecule-password, response: Access-Reject}
                  - username: AABBCCDDEEFF
                    password: aa:bb:cc:dd:ee:ff
                    attributes:
                      Service-Type: Call-Check
                      NAS-Port-Type: Ethernet
                      Calling-Station-Id: AA-BB-CC-DD-EE-FF
                    reply: >-
                      {{ (__freeradius_access_matrix | selectattr('name', 'equalto', 'unifi_printer') | first).reply }}

      always:
        - name: FREERADIUS | Restore database fixture
          containers.podman.podman_container:
            name: "{{ inventory_hostname }}"
            state: started
          delegate_to: localhost
          when: "'accounting_database' in group_names"

- name: FREERADIUS | Verify replay and session admission after database recovery
  hosts: radius_servers
  gather_facts: false
  vars:
    freeradius_postgresql_initialize_schema: false
    freeradius_simultaneous_use_max_age: 600
  module_defaults:
    community.postgresql.postgresql_query:
      login_host: "{{ freeradius_postgresql_host }}"
      login_user: "{{ freeradius_postgresql_user }}"
      login_password: "{{ freeradius_postgresql_password }}"
      login_db: "{{ freeradius_postgresql_database }}"
      ssl_mode: disable
  tasks:
    - name: FREERADIUS | Wait for replayed accounting after database recovery
      community.postgresql.postgresql_query:
        query: >-
          SELECT count(*) AS sessions FROM radacct
          WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
      register: __freeradius_sql_recovered
      until: __freeradius_sql_recovered is succeeded and __freeradius_sql_recovered.query_result[0].sessions == 1
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify Simultaneous-Use rejects another login
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - {password: molecule-password, response: Access-Reject}

    - name: FREERADIUS | Age the open session beyond the configured ten-minute window
      community.postgresql.postgresql_query:
        query: >-
          UPDATE radacct
          SET acctstarttime = CURRENT_TIMESTAMP - INTERVAL '11 minutes',
              acctupdatetime = CURRENT_TIMESTAMP - INTERVAL '11 minutes'
          WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL

    - name: FREERADIUS | Verify a stale session permits a new login
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - {password: molecule-password}

    - name: FREERADIUS | Refresh the open session with an interim update
      ansible.builtin.import_tasks: ../tasks/accounting.yml
      vars:
        __freeradius_accounting_cases:
          - {session: outage-session, status: Interim-Update}

    - name: FREERADIUS | Wait for SQL session refresh
      community.postgresql.postgresql_query:
        query: >-
          SELECT count(*) AS sessions FROM radacct
          WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
            AND acctupdatetime > acctstarttime
      register: __freeradius_sql_refreshed
      until: __freeradius_sql_refreshed.query_result[0].sessions == 1
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify the refreshed session again denies admission
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - {password: molecule-password, response: Access-Reject}

    - name: FREERADIUS | Close the recovered session
      ansible.builtin.import_tasks: ../tasks/accounting.yml
      vars:
        __freeradius_accounting_cases:
          - {session: outage-session, status: Stop}

    - name: FREERADIUS | Wait for SQL session closure
      community.postgresql.postgresql_query:
        query: >-
          SELECT count(*) AS sessions FROM radacct
          WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
      register: __freeradius_sql_closed
      until: __freeradius_sql_closed.query_result[0].sessions == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify admission resumes after session closure
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - {password: molecule-password}

- name: FREERADIUS | Exercise access profile updates and device enrollment
  hosts: radius_servers
  gather_facts: false
  vars:
    freeradius_postgresql_initialize_schema: false
    freeradius_access_profiles:
      - name: vpn_staff
        kind: vpn
        mikrotik_group: vpn-updated
        framed_pool: updated-pool
        filter_id: updated-filter
        session_timeout: 1800
        idle_timeout: 300
      - {name: printers, kind: mab, vlan_id: 310}
      - {name: quarantine, kind: mab, vlan_id: 998}
    freeradius_mab_devices:
      - mac: aa:bb:cc:dd:ee:ff
        access:
          - {client: molecule, profile: printers}
      - mac: '11:22:33:44:55:66'
        access:
          - {client: molecule, profile: printers}
  tasks:
    - name: FREERADIUS | Update VPN profile and enroll a quarantined device
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: FREERADIUS | Verify admission cases for the current configuration
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - password: molecule-password
            reply:
              - 'Mikrotik-Group = "vpn-updated"'
              - 'Framed-Pool = "updated-pool"'
              - 'Filter-Id = "updated-filter"'
              - 'Session-Timeout = 1800'
              - 'Idle-Timeout = 300'
          - username: aabbccddeeff
            password: aabbccddeeff
            attributes:
              Service-Type: Call-Check
              NAS-Port-Type: Ethernet
              Calling-Station-Id: aabbccddeeff
            reply:
              - Tunnel-Type:0 = VLAN
              - Tunnel-Medium-Type:0 = IEEE-802
              - 'Tunnel-Private-Group-Id:0 = "310"'
          - username: '112233445566'
            password: '112233445566'
            attributes:
              Service-Type: Call-Check
              NAS-Port-Type: Ethernet
              Calling-Station-Id: '112233445566'
            reply:
              - Tunnel-Type:0 = VLAN
              - Tunnel-Medium-Type:0 = IEEE-802
              - 'Tunnel-Private-Group-Id:0 = "310"'

    - name: FREERADIUS | Remove all MAC grants and local users
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        freeradius_users: []
        freeradius_mab_devices: []

    - name: FREERADIUS | Verify empty device list uses updated quarantine without PAP users
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - username: aabbccddeeff
            password: aabbccddeeff
            attributes:
              Service-Type: Call-Check
              NAS-Port-Type: Ethernet
              Calling-Station-Id: aa:bb:cc:dd:ee:ff
            reply:
              - Tunnel-Type:0 = VLAN
              - Tunnel-Medium-Type:0 = IEEE-802
              - 'Tunnel-Private-Group-Id:0 = "998"'

- name: FREERADIUS | Exercise EAP-TLS policy updates and OCSP availability
  hosts: radius_servers
  gather_facts: false
  vars:
    freeradius_postgresql_initialize_schema: false
    freeradius_users: []
    freeradius_eap_tls_revocation: ocsp
    freeradius_eap_tls_ocsp_url: http://127.0.0.1:8888/
    freeradius_eap_tls_vlan_policies:
      - {oid: '1.3.6.1.4.1.32473.1', vlan_id: 400}
    freeradius_mab_enabled: false
  tasks:
    - name: FREERADIUS | Apply certificate-only authentication with updated VLAN policy
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: FREERADIUS | Verify disabled MAC admission rejects known devices
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - username: aabbccddeeff
            password: aabbccddeeff
            attributes:
              Service-Type: Call-Check
              NAS-Port-Type: Ethernet
              Calling-Station-Id: aa:bb:cc:dd:ee:ff
            response: Access-Reject

    - name: FREERADIUS | Serve three signed OCSP responses from the test CA
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - openssl
          - ocsp
          - -index
          - ca/index
          - -port
          - '8888'
          - -rsigner
          - ca/cert.pem
          - -rkey
          - ca/key.pem
          - -CA
          - ca/cert.pem
          - -nrequest
          - '3'
        chdir: /etc/freeradius-molecule-pki
      async: 90
      poll: 0
      changed_when: true
      register: __freeradius_ocsp_fixture

    - name: FREERADIUS | Verify OCSP and the changed VLAN without PAP users
      ansible.builtin.import_tasks: ../tasks/eap_tls.yml
      vars:
        __freeradius_eap_cases:
          - {profile: staff, result: accept, vlan_hex: '343030'}
          - {profile: revoked, result: reject}

    - name: FREERADIUS | Wait for OCSP fixture to finish its three requests
      become: true
      become_user: root
      ansible.builtin.async_status:
        jid: "{{ __freeradius_ocsp_fixture.ansible_job_id }}"
      register: __freeradius_ocsp_finished
      until: __freeradius_ocsp_finished.finished
      retries: 10
      delay: 1

    - name: FREERADIUS | Verify OCSP outage denies a valid certificate
      ansible.builtin.import_tasks: ../tasks/eap_tls.yml
      vars:
        __freeradius_eap_cases:
          - {profile: staff, result: reject}

    - name: FREERADIUS | Explicitly disable certificate revocation checking
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        freeradius_eap_tls_revocation: none

    - name: FREERADIUS | Verify the explicit revocation exception
      ansible.builtin.import_tasks: ../tasks/eap_tls.yml
      vars:
        __freeradius_eap_cases:
          - {profile: revoked, result: accept, vlan_hex: '343030'}

- name: FREERADIUS | Exercise updates and service recovery
  hosts: radius_servers
  gather_facts: false
  vars:
    freeradius_authorization_enabled: false
    freeradius_mab_enabled: false
    freeradius_access_profiles: []
    freeradius_mab_devices: []
    freeradius_port: 11812
    freeradius_accounting_port: 11813
    freeradius_accounting_backend: detail
    freeradius_postgresql_initialize_schema: false
    freeradius_clients:
      - name: replacement
        address: 127.0.0.1
        secret: molecule-rotated-secret-2026
    freeradius_users:
      - name: molecule
        password: '$6$moleculerotated$Nn3rS7eZJh/1TvQv/GmfSn5EBpo5ZTHTpKmGsNFmXly6vw1YEwXoizeHQNBgpBfI71ASB0bj6mCJh5/Xl0Dt7.'
    freeradius_eap_tls_enabled: false
  tasks:
    - name: FREERADIUS | Rotate credentials and move the listener
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        public: true

    - name: FREERADIUS | Verify disabled EAP-TLS denies certificate authentication
      ansible.builtin.import_tasks: ../tasks/eap_tls.yml
      vars:
        __freeradius_eap_cases:
          - {profile: staff, result: reject, port: 11812, secret: molecule-rotated-secret-2026}

    - name: FREERADIUS | Send local accounting lifecycle
      ansible.builtin.import_tasks: ../tasks/accounting.yml
      vars:
        __freeradius_accounting_cases:
          - {session: detail-lifecycle, status: Start, port: 11813, secret: molecule-rotated-secret-2026}
          - {session: detail-lifecycle, status: Interim-Update, port: 11813, secret: molecule-rotated-secret-2026}
          - {session: detail-lifecycle, status: Stop, port: 11813, secret: molecule-rotated-secret-2026}

    - name: FREERADIUS | Find local detail records
      become: true
      become_user: root
      ansible.builtin.find:
        paths: "{{ __freeradius_log_dir }}/ansible-accounting"
        patterns: detail
      register: __freeradius_detail_files

    - name: FREERADIUS | Verify private accounting records exist
      ansible.builtin.assert:
        that:
          - __freeradius_detail_files.matched == 1
          - __freeradius_detail_files.files | map(attribute='mode') | unique | list == ['0600']
          - __freeradius_detail_files.files | map(attribute='pw_name') | unique | list == [__freeradius_user]
        quiet: true

    - name: FREERADIUS | Read stored accounting records
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: "{{ __freeradius_detail_files.files[0].path }}"
      register: __freeradius_detail_records

    - name: FREERADIUS | Verify stable session identifier and stored events
      ansible.builtin.assert:
        that:
          - "'detail-lifecycle' in (__freeradius_detail_records.content | b64decode)"
          - "'Acct-Status-Type = Start' in (__freeradius_detail_records.content | b64decode)"
          - "'Acct-Status-Type = Interim-Update' in (__freeradius_detail_records.content | b64decode)"
          - "'Acct-Status-Type = Stop' in (__freeradius_detail_records.content | b64decode)"
          - >-
            (__freeradius_detail_records.content | b64decode |
             regex_findall('Acct-Unique-Session-Id = "?([a-f0-9]{32})') | unique | length) == 1
        quiet: true

    - name: FREERADIUS | Preserve detail data before injecting an open failure
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - mv
          - "{{ __freeradius_detail_files.files[0].path }}"
          - "{{ __freeradius_detail_files.files[0].path }}.saved"
      changed_when: true

    - name: FREERADIUS | Exercise a failed detail file open
      block:
        - name: FREERADIUS | Replace the detail file with a directory
          become: true
          become_user: root
          ansible.builtin.file:
            path: "{{ __freeradius_detail_files.files[0].path }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: FREERADIUS | Close cached detail file descriptors
          become: true
          become_user: root
          ansible.builtin.service:
            name: "{{ __freeradius_service }}"
            state: restarted

        - name: FREERADIUS | Verify failed detail writes are not acknowledged
          ansible.builtin.import_tasks: ../tasks/accounting.yml
          vars:
            __freeradius_accounting_cases:
              - {session: failed-write, port: 11813, secret: molecule-rotated-secret-2026, response: No reply from server}
      always:
        - name: FREERADIUS | Remove the injected directory
          become: true
          become_user: root
          ansible.builtin.file:
            path: "{{ __freeradius_detail_files.files[0].path }}"
            state: absent

        - name: FREERADIUS | Restore original detail data
          become: true
          become_user: root
          ansible.builtin.command:
            argv:
              - mv
              - "{{ __freeradius_detail_files.files[0].path }}.saved"
              - "{{ __freeradius_detail_files.files[0].path }}"
          changed_when: true

    - name: FREERADIUS | Verify retry succeeds after storage recovery
      ansible.builtin.import_tasks: ../tasks/accounting.yml
      vars:
        __freeradius_accounting_cases:
          - {session: failed-write, port: 11813, secret: molecule-rotated-secret-2026}

    - name: FREERADIUS | Verify credential-only PAP after rotation and reject the old password
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - password: molecule-rotated-password
            port: 11812
            secret: molecule-rotated-secret-2026
            attributes: {}
            response: Access-Accept
            reply: []
          - password: molecule-password
            port: 11812
            secret: molecule-rotated-secret-2026
            attributes: {}
            response: Access-Reject

            reply: []

    - name: FREERADIUS | Stop and disable the service
      become: true
      become_user: root
      ansible.builtin.service:
        name: "{{ __freeradius_service }}"
        enabled: false
        state: stopped

    - name: FREERADIUS | Restore service with unchanged configuration
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: FREERADIUS | Verify recovered authentication
      ansible.builtin.import_tasks: ../tasks/authenticate.yml
      vars:
        __freeradius_auth_cases:
          - {password: molecule-rotated-password, port: 11812, secret: molecule-rotated-secret-2026, reply: []}

- name: FREERADIUS | Exercise empty access lists
  hosts: radius_servers
  gather_facts: false
  vars:
    freeradius_postgresql_initialize_schema: false
    freeradius_mab_devices: []
    freeradius_clients: []
    freeradius_users: []
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: FREERADIUS | Send request from a removed client
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '1'
          - 127.0.0.1:1812
          - auth
          - molecule-radius-secret-2026
        stdin: |
          User-Name = "molecule"
          User-Password = "molecule-password"
          Service-Type = Framed-User
          Framed-Protocol = PPP
          Message-Authenticator = 0x00
      changed_when: false
      failed_when: false
      register: __freeradius_removed_client

    - name: FREERADIUS | Verify removed client receives no response
      ansible.builtin.assert:
        that:
          - "'No reply from server' in __freeradius_removed_client.stdout"
        quiet: true
