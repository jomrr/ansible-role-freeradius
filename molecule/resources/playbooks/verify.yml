---
# role: freeradius
# file: molecule/resources/playbooks/verify.yml

- name: FREERADIUS | Verify PAP, VPN, MAB, EAP-TLS and SQL accounting
  hosts: radius_servers
  gather_facts: true
  tasks:
    - name: FREERADIUS | Load platform settings for verification
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"

    - name: FREERADIUS | Read service state
      ansible.builtin.service_facts: null

    - name: FREERADIUS | Verify service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services[__freeradius_service + '.service'].state == 'running'
          - ansible_facts.services[__freeradius_service + '.service'].status == 'enabled'
        quiet: true

    - name: FREERADIUS | Inspect credential file permissions
      become: true
      become_user: root
      ansible.builtin.stat:
        path: "{{ __freeradius_config_dir }}/{{ __freeradius_file }}"
      loop:
        - radiusd.conf
        - user
      loop_control:
        loop_var: __freeradius_file
      register: __freeradius_permissions

    - name: FREERADIUS | Verify credentials are protected
      ansible.builtin.assert:
        that:
          - __freeradius_permission.stat.mode == '0640'
          - __freeradius_permission.stat.pw_name == 'root'
          - __freeradius_permission.stat.gr_name == __freeradius_group
        quiet: true
      loop: "{{ __freeradius_permissions.results }}"
      loop_control:
        loop_var: __freeradius_permission
        label: "{{ __freeradius_permission.stat.path }}"

    - name: FREERADIUS | Verify EAP-TLS certificate authorization and VLAN mapping
      become: true
      become_user: root
      # eapol_test can print binary TLS data; keep Ansible UTF-8 validation enabled.
      ansible.builtin.shell: |
        set -o pipefail
        eapol_test -c /etc/freeradius-molecule-pki/eap-{{ __freeradius_eap_case.profile }}.conf \
          -A {{ __freeradius_eap_case.source | default('127.0.0.1') | quote }} \
          -p {{ __freeradius_eap_case.port | default(1812) | int }} \
          -s {{ __freeradius_eap_case.secret | default('molecule-radius-secret-2026') | quote }} -t 10 -r 1 2>&1 |
          LC_ALL=C tr -cd '\11\12\15\40-\176'
      args:
        executable: /bin/bash
      loop:
        - profile: staff
          result: accept
          vlan_hex: '313030'
        - profile: rsa_key_transport
          result: reject
        - profile: staff
          source: 127.0.0.3
          secret: molecule-unassigned-secret-2026
          result: reject
        - profile: staff
          source: 127.0.0.2
          secret: molecule-mikrotik-secret-2026
          result: reject
        - profile: guest
          result: accept
          vlan_hex: '323030'
          phase1: tls_disable_tlsv1_2=1 tls_disable_tlsv1_3=0
        - profile: missing_policy
          result: reject
        - profile: unknown_policy
          result: reject
        - profile: multiple_policy
          result: reject
        - profile: missing_eku
          result: reject
        - profile: wrong_eku
          result: reject
        - profile: wrong_issuer
          result: reject
        - profile: untrusted
          result: reject
        - profile: revoked
          result: reject
        - profile: expired
          result: reject
        - profile: qualified
          result: reject
      loop_control:
        loop_var: __freeradius_eap_case
        label: "{{ __freeradius_eap_case.profile }} / {{ __freeradius_eap_case.source | default('127.0.0.1') }}"
      changed_when: false
      failed_when: |-
        (__freeradius_eap_result.rc == 0) != (__freeradius_eap_case.result == 'accept') or
        ('SUCCESS' if __freeradius_eap_case.result == 'accept' else 'Access-Reject') not in __freeradius_eap_result.stdout or
        (__freeradius_eap_case.result == 'accept' and (
         __freeradius_eap_result.stdout is not search('Tunnel-Type[^\n]*\n +Value: 0000000d') or
         __freeradius_eap_result.stdout is not search('Tunnel-Medium-Type[^\n]*\n +Value: 00000006') or
         __freeradius_eap_result.stdout is not search('Tunnel-Private-Group-Id[^\n]*\n +Value: ' ~ __freeradius_eap_case.vlan_hex))) or
        (__freeradius_eap_case.result != 'accept' and
         __freeradius_eap_result.stdout is search('Access-Accept|Tunnel-Private-Group-Id'))
      register: __freeradius_eap_result

    - name: FREERADIUS | Verify PAP hash formats and VPN or MAB authorization
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Reject
          request: |
            User-Name = "molecule"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: yescrypt / Access-Accept
          request: |
            User-Name = "yescrypt"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: yescrypt / Access-Reject
          request: |
            User-Name = "yescrypt"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: pbkdf2 / Access-Accept
          request: |
            User-Name = "pbkdf2"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: pbkdf2 / Access-Reject
          request: |
            User-Name = "pbkdf2"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: ssha512 / Access-Accept
          request: |
            User-Name = "ssha512"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: ssha512 / Access-Reject
          request: |
            User-Name = "ssha512"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: cleartext / Access-Accept
          request: |
            User-Name = "cleartext"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: cleartext / Access-Reject
          request: |
            User-Name = "cleartext"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: nthash / Access-Accept
          request: |
            User-Name = "nthash"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: nthash / Access-Reject
          request: |
            User-Name = "nthash"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: vpn_profile
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
        - name: vpn_without_grant
          request: |
            User-Name = "no_profile"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: vpn_wrong_nas
          request: |
            User-Name = "yescrypt"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
            Packet-Src-IP-Address = "127.0.0.3"
          response: Access-Reject
          reply: []
          secret: molecule-unassigned-secret-2026
        - name: vpn_wrong_service
          request: |
            User-Name = "cleartext"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Login-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
        - name: unifi_printer
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "aa:bb:cc:dd:ee:ff"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabb.ccdd.eeff"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "300"
            - Idle-Timeout = 120
        - name: unifi_wifi
          request: |
            User-Name = "aa-bb-cc-dd-ee-ff"
            User-Password = "AABB.CCDD.EEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Wireless-802.11"
            Calling-Station-Id = "AA:BB:CC:DD:EE:FF"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "300"
            - Idle-Timeout = 120
        - name: mikrotik_printer
          request: |
            User-Name = "aabb.ccdd.eeff"
            User-Password = "AA-BB-CC-DD-EE-FF"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aa:bb:cc:dd:ee:ff"
            Packet-Src-IP-Address = "127.0.0.2"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "300"
            - Idle-Timeout = 120
          secret: molecule-mikrotik-secret-2026
        - name: unknown_mac
          request: |
            User-Name = "112233445566"
            User-Password = "11:22:33:44:55:66"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "11-22-33-44-55-66"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "999"
            - Session-Timeout = 120
        - name: mac_without_nas_grant
          request: |
            User-Name = "1234567890ab"
            User-Password = "12:34:56:78:90:ab"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "12:34:56:78:90:ab"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "999"
            - Session-Timeout = 120
        - name: incorrect_mac_password
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "112233445566"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabb.ccdd.eeff"
          response: Access-Reject
          reply: []
        - name: malformed_mac_password
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabb.ccdd.eeff"
          response: Access-Reject
          reply: []
        - name: incorrect_unknown_mac_password
          request: |
            User-Name = "112233445566"
            User-Password = "incorrect-password"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "11-22-33-44-55-66"
          response: Access-Reject
          reply: []
        - name: missing_station_mac
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
          response: Access-Reject
          reply: []
        - name: mismatched_station_mac
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "112233445566"
          response: Access-Reject
          reply: []
        - name: malformed_mac
          request: |
            User-Name = "not-a-mac"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabb.ccdd.eeff"
          response: Access-Reject
          reply: []
        - name: incorrect_port_type
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Virtual"
            Calling-Station-Id = "AABBCCDDEEFF"
          response: Access-Reject
          reply: []
        - name: incorrect_service_type
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Login-User"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "AABBCCDDEEFF"
          response: Access-Reject
          reply: []
        - name: client_without_mab_service
          request: |
            User-Name = "AABBCCDDEEFF"
            User-Password = "AABBCCDDEEFF"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabb.ccdd.eeff"
            Packet-Src-IP-Address = "127.0.0.3"
          response: Access-Reject
          reply: []
          secret: molecule-unassigned-secret-2026
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | sort !=
         (__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim') |
          select('match', '^(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout|Termination-Action)') | sort))

    - name: FREERADIUS | Read admission audit events
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - journalctl
          - --no-pager
          - -u
          - "{{ __freeradius_service }}"
          - -o
          - cat
      changed_when: false
      register: __freeradius_access_audit

    - name: FREERADIUS | Verify VPN, MAC and EAP-TLS audit identity
      ansible.builtin.assert:
        that:
          - "'stage=vpn profile=vpn_staff' in __freeradius_access_audit.stdout"
          - "'stage=mab profile=printers mac=aabbccddeeff' in __freeradius_access_audit.stdout"
          - "'stage=mab_quarantine profile=quarantine mac=112233445566' in __freeradius_access_audit.stdout"
          - "'stage=mab_invalid' in __freeradius_access_audit.stdout"
          - >-
            __freeradius_access_audit.stdout is search(
            'event=radius_auth result=Access-Accept user_hex=61646d696e6973747261746f72 '
            ~ '[^\n]*stage=eap_tls [^\n]*cert_serial=[0-9a-f]+ cert_subject_hex=2f434e3d6d6f6c6563756c65(\s|$)')
          - >-
            __freeradius_access_audit.stdout is search(
            'event=radius_auth result=Access-Reject user_hex=61646d696e6973747261746f72 '
            ~ '[^\n]*stage=eap_tls [^\n]*cert_serial=[0-9a-f]+ cert_subject_hex=2f434e3d6d6f6c6563756c65(\s|$)')
          - "'molecule-password' not in __freeradius_access_audit.stdout"
        quiet: true

    - name: FREERADIUS | Exercise SQL session lifecycle
      module_defaults:
        community.postgresql.postgresql_query:
          login_host: "{{ freeradius_postgresql_host }}"
          login_user: "{{ freeradius_postgresql_user }}"
          login_password: "{{ freeradius_postgresql_password }}"
          login_db: "{{ freeradius_postgresql_database }}"
          ssl_mode: disable
      block:
        - name: FREERADIUS | Attempt runtime schema changes in rollback-only transactions
          community.postgresql.postgresql_query:
            query:
              - "{{ __freeradius_ddl_probe }}"
              - ROLLBACK
          loop:
            - ALTER TABLE public.radacct ADD COLUMN molecule_forbidden integer
            - DROP TABLE public.radacct
            - TRUNCATE public.radacct
          loop_control:
            loop_var: __freeradius_ddl_probe
            break_when: __freeradius_ddl_result is failed
          register: __freeradius_ddl_result
          changed_when: false
          failed_when: __freeradius_ddl_result.msg | default('') is not search('must be owner|permission denied')

        - name: FREERADIUS | Reset lifecycle fixture
          community.postgresql.postgresql_query:
            login_user: "{{ freeradius_postgresql_schema_user }}"
            login_password: "{{ freeradius_postgresql_schema_password }}"
            query: DELETE FROM radacct WHERE acctsessionid = 'sql-lifecycle'
          no_log: true

        - name: FREERADIUS | Send unsupported statuses before session start and retransmission
          ansible.builtin.command:
            argv:
              - radclient
              - -x
              - -r
              - '1'
              - -t
              - '3'
              - "127.0.0.1:{{ __freeradius_case.port | default(1813) }}"
              - acct
              - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
            stdin: "{{ __freeradius_case.request }}"
          loop:
            - name: sql-lifecycle / Failed
              request: |
                User-Name = "molecule"
                Acct-Status-Type = Failed
                Acct-Session-Id = "sql-lifecycle"
                NAS-Identifier = "molecule"
                NAS-Port = 1
                Acct-Session-Time = 60
                Acct-Input-Octets = 1234
                Acct-Input-Gigawords = 1
                Acct-Output-Octets = 5678
                Acct-Delay-Time = 10
                NAS-IP-Address = 127.0.0.1
                Event-Timestamp = 1711846770
              response: Accounting-Response
            - name: sql-lifecycle / Tunnel-Start
              request: |
                User-Name = "molecule"
                Acct-Status-Type = Tunnel-Start
                Acct-Session-Id = "sql-lifecycle"
                NAS-Identifier = "molecule"
                NAS-Port = 1
                Acct-Session-Time = 60
                Acct-Input-Octets = 1234
                Acct-Input-Gigawords = 1
                Acct-Output-Octets = 5678
                Acct-Delay-Time = 10
                NAS-IP-Address = 127.0.0.1
                Event-Timestamp = 1711846770
              response: Accounting-Response
            - name: sql-lifecycle / Start
              request: |
                User-Name = "molecule"
                Acct-Status-Type = Start
                Acct-Session-Id = "sql-lifecycle"
                NAS-Identifier = "molecule"
                NAS-Port = 1
                Acct-Session-Time = 60
                Acct-Input-Octets = 1234
                Acct-Input-Gigawords = 1
                Acct-Output-Octets = 5678
                Acct-Delay-Time = 10
                Event-Timestamp = 1711846770
              response: Accounting-Response
            - name: sql-lifecycle / Start
              request: |
                User-Name = "molecule"
                Acct-Status-Type = Start
                Acct-Session-Id = "sql-lifecycle"
                NAS-Identifier = "molecule"
                NAS-Port = 1
                Acct-Session-Time = 60
                Acct-Input-Octets = 1234
                Acct-Input-Gigawords = 1
                Acct-Output-Octets = 5678
                Acct-Delay-Time = 10
                Event-Timestamp = 1711846770
              response: Accounting-Response
            - name: sql-lifecycle / Interim-Update
              request: |
                User-Name = "molecule"
                Acct-Status-Type = Interim-Update
                Acct-Session-Id = "sql-lifecycle"
                NAS-Identifier = "molecule"
                NAS-Port = 1
                Acct-Session-Time = 60
                Acct-Input-Octets = 1234
                Acct-Input-Gigawords = 1
                Acct-Output-Octets = 5678
                Acct-Delay-Time = 10
                NAS-IP-Address = 127.0.0.1
                Event-Timestamp = 1711846830
              response: Accounting-Response
          loop_control:
            loop_var: __freeradius_case
            label: "{{ __freeradius_case.name }}"
          changed_when: false
          register: __freeradius_response
          failed_when: __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr)

        - name: FREERADIUS | Wait for one updated SQL session
          community.postgresql.postgresql_query:
            query: |-
              SELECT count(*) AS sessions, max(acctinputoctets) AS received,
                     max(acctoutputoctets) AS sent, max(acctsessiontime) AS duration,
                     extract(epoch FROM max(acctstarttime))::bigint AS started,
                     extract(epoch FROM max(acctupdatetime))::bigint AS updated,
                     bool_and(acctstoptime IS NULL) AS active
              FROM radacct WHERE acctsessionid = 'sql-lifecycle'
          register: __freeradius_sql_session
          until:
            - __freeradius_sql_session.query_result[0].sessions == 1
            - __freeradius_sql_session.query_result[0].received == 4294968530
            - __freeradius_sql_session.query_result[0].sent == 5678
