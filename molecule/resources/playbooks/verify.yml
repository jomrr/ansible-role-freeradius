---
# role: freeradius
# file: molecule/resources/playbooks/verify.yml

- name: FREERADIUS | Verify authentication service
  hosts: radius_servers
  gather_facts: true
  tasks:
    - name: FREERADIUS | Verify service state and credential permissions
      ansible.builtin.import_tasks: ../tasks/service.yml

    - name: FREERADIUS | Verify EAP-TLS certificate authorization and VLAN mapping
      ansible.builtin.include_tasks: ../tasks/eap_tls.yml
      loop:
        - {profile: staff, result: accept, vlan_hex: '313030'}
        - profile: guest
          result: accept
          vlan_hex: '323030'
          phase1: tls_disable_tlsv1_2=1 tls_disable_tlsv1_3=0
        - {profile: missing_policy, result: reject}
        - {profile: unknown_policy, result: reject}
        - {profile: multiple_policy, result: reject}
        - {profile: missing_eku, result: reject}
        - {profile: wrong_eku, result: reject}
        - {profile: wrong_issuer, result: reject}
        - {profile: untrusted, result: reject}
        - {profile: revoked, result: reject}
        - {profile: expired, result: reject}
        - {profile: qualified, result: reject}
      loop_control:
        loop_var: __freeradius_eap_probe
        label: "{{ __freeradius_eap_probe.profile }}"

    - name: FREERADIUS | Verify every supported credential format
      ansible.builtin.include_tasks: ../tasks/authenticate.yml
      loop: >-
        {{ ['molecule', 'yescrypt', 'pbkdf2', 'ssha512', 'cleartext', 'nthash'] |
           product(['molecule-password', 'incorrect-password']) | list }}
      loop_control:
        loop_var: __freeradius_credential_probe
        label: "{{ __freeradius_credential_probe.0 }} / {{ __freeradius_expected_auth_response }}"
      vars:
        __freeradius_test_port: 1812
        __freeradius_test_secret: molecule-radius-secret-2026
        __freeradius_test_username: "{{ __freeradius_credential_probe.0 }}"
        __freeradius_test_password: "{{ __freeradius_credential_probe.1 }}"
        __freeradius_expected_auth_response: >-
          {{ 'Access-Accept' if __freeradius_credential_probe.1 == 'molecule-password' else 'Access-Reject' }}

    - name: FREERADIUS | Verify VPN and MAC access profiles
      ansible.builtin.import_tasks: ../tasks/access.yml

    - name: FREERADIUS | Verify attempt limiting and audit events
      ansible.builtin.import_tasks: ../tasks/security.yml

    - name: FREERADIUS | Verify SQL accounting lifecycle
      ansible.builtin.import_tasks: ../tasks/accounting_sql.yml

    - name: FREERADIUS | Verify unsafe client definitions are rejected
      ansible.builtin.include_tasks: ../tasks/invalid_client.yml
      run_once: true
      loop:
        - name: unrestricted_network
          clients:
            - {name: everywhere, address: 0.0.0.0/0, secret: molecule-radius-secret-2026}
          failed_task: FREERADIUS | Validate client network syntax
        - name: repeated_secret
          clients:
            - {name: first, address: 192.0.2.1, secret: molecule-radius-secret-2026}
            - {name: second, address: 192.0.2.2, secret: molecule-radius-secret-2026}
          failed_task: FREERADIUS | Require a distinct shared secret for each client
        - name: invalid_profile_vlan
          profiles:
            - {name: invalid, kind: mab, vlan_id: 4095}
          failed_task: FREERADIUS | Validate access profile constraints
        - name: unknown_profile_reference
          devices:
            - mac: aa:bb:cc:dd:ee:ff
              access:
                - {client: molecule, profile: nonexistent}
          failed_task: FREERADIUS | Validate MAB grant references
        - name: repeated_client_grant
          devices:
            - mac: aa:bb:cc:dd:ee:ff
              access:
                - {client: molecule, profile: printers}
                - {client: molecule, profile: quarantine}
          failed_task: FREERADIUS | Require unique client grants per identity
        - name: repeated_normalized_mac
          devices:
            - {mac: 'aa:bb:cc:dd:ee:ff'}
            - {mac: AABBCCDDEEFF}
          failed_task: FREERADIUS | Validate authorization prerequisites
      loop_control:
        loop_var: __freeradius_invalid_client
        label: "{{ __freeradius_invalid_client.name }}"
