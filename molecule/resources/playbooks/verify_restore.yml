---
# role: freeradius
# file: molecule/resources/playbooks/verify_restore.yml

- name: FREERADIUS | Verify restored authentication and accounting
  hosts: radius_servers
  gather_facts: true
  module_defaults:
    community.postgresql.postgresql_query:
      login_host: "{{ freeradius_postgresql_host }}"
      login_user: "{{ freeradius_postgresql_user }}"
      login_password: "{{ freeradius_postgresql_password }}"
      login_db: "{{ freeradius_postgresql_database }}"
      ssl_mode: disable
  tasks:
    - name: FREERADIUS | Verify restored service state and credential permissions
      ansible.builtin.import_tasks: ../tasks/service.yml

    - name: FREERADIUS | Verify restored VPN and both NAS types including quarantine
      ansible.builtin.include_tasks: ../tasks/access.yml
      vars:
        __freeradius_access_cases: [vpn_profile, unifi_printer, mikrotik_printer, unknown_mac]

    - name: FREERADIUS | Verify restored EAP-TLS VLAN and certificate revocation
      ansible.builtin.include_tasks: ../tasks/eap_tls.yml
      loop:
        - {profile: staff, result: accept, vlan_hex: '313030'}
        - {profile: revoked, result: reject}
      loop_control:
        loop_var: __freeradius_eap_probe
        label: "{{ __freeradius_eap_probe.profile }}"

    - name: FREERADIUS | Reset the restored accounting fixture
      community.postgresql.postgresql_query:
        login_user: "{{ freeradius_postgresql_schema_user }}"
        login_password: "{{ freeradius_postgresql_schema_password }}"
        query: DELETE FROM radacct WHERE acctsessionid = 'restored-session'
      no_log: true

    - name: FREERADIUS | Send a session through the restored SQL backend
      ansible.builtin.include_tasks: ../tasks/accounting.yml
      loop: [Start, Stop]
      loop_control:
        loop_var: __freeradius_test_acct_status
      vars:
        __freeradius_test_acct_session: restored-session
        __freeradius_test_acct_timestamp: 1711846830

    - name: FREERADIUS | Verify the restored SQL queue records the closed session
      community.postgresql.postgresql_query:
        query: >-
          SELECT count(*) AS sessions FROM radacct
          WHERE acctsessionid = 'restored-session' AND acctstoptime = to_timestamp(1711846830)
      register: __freeradius_sql_restored
      until: __freeradius_sql_restored.query_result[0].sessions == 1
      retries: 30
      delay: 2
      changed_when: false
