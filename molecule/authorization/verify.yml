---
# role: freeradius
# file: molecule/authorization/verify.yml

- name: FREERADIUS | Verify changed profiles and newly enrolled MAC
  hosts: radius_servers
  gather_facts: true
  tasks:
    - name: FREERADIUS | Verify admission cases for the current configuration
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Accept
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-updated"
            - Framed-Pool = "updated-pool"
            - Filter-Id = "updated-filter"
            - Session-Timeout = 1800
            - Termination-Action = RADIUS-Request
            - Idle-Timeout = 300
        - name: aabbccddeeff / Access-Accept
          request: |
            User-Name = "aabbccddeeff"
            User-Password = "aabbccddeeff"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "aabbccddeeff"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "310"
            - Session-Timeout = 600
            - Termination-Action = RADIUS-Request
        - name: 112233445566 / Access-Accept
          request: |
            User-Name = "112233445566"
            User-Password = "112233445566"
            Message-Authenticator = 0x00
            Service-Type = "Call-Check"
            NAS-Port-Type = "Ethernet"
            Calling-Station-Id = "112233445566"
          response: Access-Accept
          reply:
            - Tunnel-Type:0 = VLAN
            - Tunnel-Medium-Type:0 = IEEE-802
            - Tunnel-Private-Group-Id:0 = "310"
            - Session-Timeout = 600
            - Termination-Action = RADIUS-Request
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | sort !=
         (__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim') |
          select('match', '^(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout|Termination-Action)') | sort))
  gather_subset:
    - min
