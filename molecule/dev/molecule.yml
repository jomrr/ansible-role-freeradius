---
# role: freeradius
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      radius_servers:
        freeradius_accounting_enabled: true
        freeradius_accounting_backend: "postgresql"
        freeradius_postgresql_host: "freeradius-accounting-db"
        freeradius_postgresql_database: "{{ inventory_hostname | replace('-', '_') }}"
        freeradius_postgresql_user: "radius"
        freeradius_postgresql_password: "molecule-runtime-secret-2026"
        freeradius_postgresql_schema_user: "radius_owner"
        freeradius_postgresql_schema_password: "molecule-owner-secret-2026"
        freeradius_postgresql_ssl_mode: "disable"
        freeradius_postgresql_initialize_schema: true
        freeradius_eap_tls_enabled: true
        freeradius_eap_tls_certificate_file: "/etc/freeradius-molecule-pki/server.pem"
        freeradius_eap_tls_private_key_file: "/etc/freeradius-molecule-pki/server.key"
        freeradius_eap_tls_ca_file: "/etc/freeradius-molecule-pki/trust.pem"
        freeradius_eap_tls_issuer: "/CN=Molecule ca"
        freeradius_eap_tls_ca_path: "/etc/freeradius-molecule-pki/trust"
        freeradius_eap_tls_vlan_policies:
          - oid: "1.3.6.1.4.1.32473.1"
            vlan_id: 100
          - oid: "1.3.6.1.4.1.32473.2"
            vlan_id: 200
        freeradius_failure_limit: 3
        freeradius_failure_window: 30
        freeradius_authorization_enabled: true
        freeradius_mab_enabled: true
        freeradius_mab_quarantine_profile: "quarantine"
        freeradius_access_profiles:
          - name: "vpn_staff"
            kind: "vpn"
            mikrotik_group: "vpn-staff"
            framed_pool: "vpn-pool"
            filter_id: "vpn-filter"
            session_timeout: 3600
            idle_timeout: 600
          - name: "printers"
            kind: "mab"
            vlan_id: 300
            session_timeout: 600
            idle_timeout: 120
          - name: "quarantine"
            kind: "mab"
            vlan_id: 999
            session_timeout: 120
        freeradius_mab_devices:
          - mac: "aa:bb:cc:dd:ee:ff"
            access:
              - client: "molecule"
                profile: "printers"
              - client: "mikrotik_mab"
                profile: "printers"
          - mac: "12:34:56:78:90:ab"
            access:
              - client: "mikrotik_mab"
                profile: "printers"
        freeradius_clients:
          - name: "molecule"
            address: "127.0.0.1"
            secret: "molecule-radius-secret-2026"
            services:
              - "vpn"
              - "mab"
            mab_service_type: "Call-Check"
          - name: "mikrotik_mab"
            address: "127.0.0.2"
            secret: "molecule-mikrotik-secret-2026"
            services:
              - "mab"
            mab_service_type: "Framed-User"
          - name: "unassigned"
            address: "127.0.0.3"
            secret: "molecule-unassigned-secret-2026"
            services:
              - "vpn"
        freeradius_users:
          - name: "molecule"
            password: "$$6$$moleculefixture$$7iP0CMRfRDetFtaURogLajuthlIvPcj.LrPKVwuhXgBKSjto.1e/rWwXJdk0ANZDn5dB1AjUMBdXigv9CTTnX0"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "yescrypt"
            password: "$$y$$j9T$$4t5m3NETzIbg3nUDVlDFk0$$.vWIX7aKYcYjuS2ZRRp3LYuGpPxdXCfSqMHftxJFEK9"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "pbkdf2"
            password_attribute: "PBKDF2-Password"
            password: "$$PBKDF2$$HMACSHA2+256:10000:bW9sZWN1bGUtcmFkaXVzLXRlc3Q=$$EVuwQXzj4cnInQKgJV0ebDNOsB9bH8cPn93w1zV4Mc8="
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "ssha512"
            password_attribute: "SSHA2-512-Password"
            password: "UvtgGlsFQrNfyW1K6piCcunSJk9xmlSnC7/mtLymenxSdcVlhG2vcSUbcAZF/4THoFcaqdq7QumhEZc3Aj3NBG1vbGVjdWxlLXJhZGl1cy10ZXN0"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "cleartext"
            password_attribute: "Cleartext-Password"
            password: "molecule-password"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "nthash"
            password_attribute: "NT-Password"
            password: "296c92fcc9aaaa38289733d6d46c931a"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "no_profile"
            password: "$$6$$moleculefixture$$7iP0CMRfRDetFtaURogLajuthlIvPcj.LrPKVwuhXgBKSjto.1e/rWwXJdk0ANZDn5dB1AjUMBdXigv9CTTnX0"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify ../resources/playbooks/verify_restore.yml"
    - "destroy"
  name: "dev"
platforms:
  - name: "almalinux-latest-freeradius"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "debian-latest-freeradius"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "fedora-latest-freeradius"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "opensuse-leap-latest-freeradius"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "opensuse-tumbleweed-latest-freeradius"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "ubuntu-latest-freeradius"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "freeradius-accounting-db"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "accounting_database"
    env:
      POSTGRES_PASSWORD: "molecule-postgresql-secret-2026"
