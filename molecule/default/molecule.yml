---
# role: freeradius
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      radius_servers:
        freeradius_accounting_enabled: true
        freeradius_accounting_backend: "postgresql"
        freeradius_postgresql_host: "freeradius-accounting-db"
        freeradius_postgresql_database: "{{ inventory_hostname | replace('-', '_') }}"
        freeradius_postgresql_user: "radius"
        freeradius_postgresql_password: "molecule-runtime-secret-2026"
        freeradius_postgresql_schema_user: "radius_owner"
        freeradius_postgresql_schema_password: "molecule-owner-secret-2026"
        freeradius_postgresql_ssl_mode: "disable"
        freeradius_postgresql_initialize_schema: true
        freeradius_eap_tls_enabled: true
        freeradius_eap_tls_certificate_file: "/etc/freeradius-molecule-pki/server.pem"
        freeradius_eap_tls_private_key_file: "/etc/freeradius-molecule-pki/server.key"
        freeradius_eap_tls_ca_file: "/etc/freeradius-molecule-pki/trust.pem"
        freeradius_eap_tls_issuer: "/CN=Molecule ca"
        freeradius_eap_tls_ca_path: "/etc/freeradius-molecule-pki/trust"
        freeradius_eap_tls_vlan_policies:
          - oid: "1.3.6.1.4.1.32473.1"
            vlan_id: 100
          - oid: "1.3.6.1.4.1.32473.2"
            vlan_id: 200
        freeradius_failure_limit: 3
        freeradius_failure_window: 30
        freeradius_authorization_enabled: true
        freeradius_mab_enabled: true
        freeradius_mab_quarantine_profile: "quarantine"
        freeradius_access_profiles:
          - name: "vpn_staff"
            kind: "vpn"
            mikrotik_group: "vpn-staff"
            framed_pool: "vpn-pool"
            filter_id: "vpn-filter"
            session_timeout: 3600
            idle_timeout: 600
          - name: "printers"
            kind: "mab"
            vlan_id: 300
            session_timeout: 600
            idle_timeout: 120
          - name: "quarantine"
            kind: "mab"
            vlan_id: 999
            session_timeout: 120
        freeradius_mab_devices:
          - mac: "aa:bb:cc:dd:ee:ff"
            access:
              - client: "molecule"
                profile: "printers"
              - client: "mikrotik_mab"
                profile: "printers"
          - mac: "12:34:56:78:90:ab"
            access:
              - client: "mikrotik_mab"
                profile: "printers"
        freeradius_clients:
          - name: "molecule"
            address: "127.0.0.1"
            secret: "molecule-radius-secret-2026"
            services:
              - "vpn"
              - "mab"
            mab_service_type: "Call-Check"
          - name: "mikrotik_mab"
            address: "127.0.0.2"
            secret: "molecule-mikrotik-secret-2026"
            services:
              - "mab"
            mab_service_type: "Framed-User"
          - name: "unassigned"
            address: "127.0.0.3"
            secret: "molecule-unassigned-secret-2026"
            services:
              - "vpn"
        freeradius_users:
          - name: "molecule"
            password: "$$6$$moleculefixture$$7iP0CMRfRDetFtaURogLajuthlIvPcj.LrPKVwuhXgBKSjto.1e/rWwXJdk0ANZDn5dB1AjUMBdXigv9CTTnX0"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "yescrypt"
            password: "$$y$$j9T$$4t5m3NETzIbg3nUDVlDFk0$$.vWIX7aKYcYjuS2ZRRp3LYuGpPxdXCfSqMHftxJFEK9"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "pbkdf2"
            password_attribute: "PBKDF2-Password"
            password: "$$PBKDF2$$HMACSHA2+256:10000:bW9sZWN1bGUtcmFkaXVzLXRlc3Q=$$EVuwQXzj4cnInQKgJV0ebDNOsB9bH8cPn93w1zV4Mc8="
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "ssha512"
            password_attribute: "SSHA2-512-Password"
            password: "UvtgGlsFQrNfyW1K6piCcunSJk9xmlSnC7/mtLymenxSdcVlhG2vcSUbcAZF/4THoFcaqdq7QumhEZc3Aj3NBG1vbGVjdWxlLXJhZGl1cy10ZXN0"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "cleartext"
            password_attribute: "Cleartext-Password"
            password: "molecule-password"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "nthash"
            password_attribute: "NT-Password"
            password: "296c92fcc9aaaa38289733d6d46c931a"
            access:
              - client: "molecule"
                profile: "vpn_staff"
          - name: "no_profile"
            password: "$$6$$moleculefixture$$7iP0CMRfRDetFtaURogLajuthlIvPcj.LrPKVwuhXgBKSjto.1e/rWwXJdk0ANZDn5dB1AjUMBdXigv9CTTnX0"
        __freeradius_eap_baseline_cases:
          - profile: "staff"
            result: "accept"
            vlan_hex: "313030"
          - profile: "guest"
            result: "accept"
            vlan_hex: "323030"
            phase1: "tls_disable_tlsv1_2=1 tls_disable_tlsv1_3=0"
          - profile: "missing_policy"
            result: "reject"
          - profile: "unknown_policy"
            result: "reject"
          - profile: "multiple_policy"
            result: "reject"
          - profile: "missing_eku"
            result: "reject"
          - profile: "wrong_eku"
            result: "reject"
          - profile: "wrong_issuer"
            result: "reject"
          - profile: "untrusted"
            result: "reject"
          - profile: "revoked"
            result: "reject"
          - profile: "expired"
            result: "reject"
          - profile: "qualified"
            result: "reject"
        __freeradius_access_matrix:
          - name: "vpn_profile"
            username: "molecule"
            password: "molecule-password"
            attributes:
              Service-Type: "Framed-User"
              Framed-Protocol: "PPP"
            reply:
              - "Mikrotik-Group = \"vpn-staff\""
              - "Framed-Pool = \"vpn-pool\""
              - "Filter-Id = \"vpn-filter\""
              - "Session-Timeout = 3600"
              - "Idle-Timeout = 600"
          - name: "vpn_without_grant"
            username: "no_profile"
            password: "molecule-password"
            attributes:
              Service-Type: "Framed-User"
              Framed-Protocol: "PPP"
            response: "Access-Reject"
          - name: "vpn_wrong_nas"
            username: "yescrypt"
            password: "molecule-password"
            source: "127.0.0.3"
            secret: "molecule-unassigned-secret-2026"
            attributes:
              Service-Type: "Framed-User"
              Framed-Protocol: "PPP"
            response: "Access-Reject"
          - name: "vpn_wrong_service"
            username: "cleartext"
            password: "molecule-password"
            attributes:
              Service-Type: "Login-User"
              Framed-Protocol: "PPP"
            response: "Access-Reject"
          - name: "unifi_printer"
            username: "AABBCCDDEEFF"
            password: "aa:bb:cc:dd:ee:ff"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aabb.ccdd.eeff"
            reply:
              - "Tunnel-Type:0 = VLAN"
              - "Tunnel-Medium-Type:0 = IEEE-802"
              - "Tunnel-Private-Group-Id:0 = \"300\""
              - "Session-Timeout = 600"
              - "Idle-Timeout = 120"
          - name: "unifi_wifi"
            username: "aa-bb-cc-dd-ee-ff"
            password: "AABB.CCDD.EEFF"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Wireless-802.11"
              Calling-Station-Id: "AA:BB:CC:DD:EE:FF"
            reply:
              - "Tunnel-Type:0 = VLAN"
              - "Tunnel-Medium-Type:0 = IEEE-802"
              - "Tunnel-Private-Group-Id:0 = \"300\""
              - "Session-Timeout = 600"
              - "Idle-Timeout = 120"
          - name: "mikrotik_printer"
            username: "aabb.ccdd.eeff"
            password: "AA-BB-CC-DD-EE-FF"
            source: "127.0.0.2"
            secret: "molecule-mikrotik-secret-2026"
            attributes:
              Service-Type: "Framed-User"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aa:bb:cc:dd:ee:ff"
            reply:
              - "Tunnel-Type:0 = VLAN"
              - "Tunnel-Medium-Type:0 = IEEE-802"
              - "Tunnel-Private-Group-Id:0 = \"300\""
              - "Session-Timeout = 600"
              - "Idle-Timeout = 120"
          - name: "unknown_mac"
            username: "112233445566"
            password: "11:22:33:44:55:66"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "11-22-33-44-55-66"
            reply:
              - "Tunnel-Type:0 = VLAN"
              - "Tunnel-Medium-Type:0 = IEEE-802"
              - "Tunnel-Private-Group-Id:0 = \"999\""
              - "Session-Timeout = 120"
          - name: "mac_without_nas_grant"
            username: "1234567890ab"
            password: "12:34:56:78:90:ab"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "12:34:56:78:90:ab"
            reply:
              - "Tunnel-Type:0 = VLAN"
              - "Tunnel-Medium-Type:0 = IEEE-802"
              - "Tunnel-Private-Group-Id:0 = \"999\""
              - "Session-Timeout = 120"
          - name: "incorrect_mac_password"
            username: "AABBCCDDEEFF"
            password: "112233445566"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aabb.ccdd.eeff"
            response: "Access-Reject"
          - name: "malformed_mac_password"
            username: "AABBCCDDEEFF"
            password: "incorrect-password"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aabb.ccdd.eeff"
            response: "Access-Reject"
          - name: "incorrect_unknown_mac_password"
            username: "112233445566"
            password: "incorrect-password"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "11-22-33-44-55-66"
            response: "Access-Reject"
          - name: "missing_station_mac"
            username: "AABBCCDDEEFF"
            password: "AABBCCDDEEFF"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
            response: "Access-Reject"
          - name: "mismatched_station_mac"
            username: "AABBCCDDEEFF"
            password: "AABBCCDDEEFF"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "112233445566"
            response: "Access-Reject"
          - name: "malformed_mac"
            username: "not-a-mac"
            password: "AABBCCDDEEFF"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aabb.ccdd.eeff"
            response: "Access-Reject"
          - name: "incorrect_port_type"
            username: "AABBCCDDEEFF"
            password: "AABBCCDDEEFF"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Virtual"
              Calling-Station-Id: "AABBCCDDEEFF"
            response: "Access-Reject"
          - name: "incorrect_service_type"
            username: "AABBCCDDEEFF"
            password: "AABBCCDDEEFF"
            attributes:
              Service-Type: "Login-User"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "AABBCCDDEEFF"
            response: "Access-Reject"
          - name: "client_without_mab_service"
            username: "AABBCCDDEEFF"
            password: "AABBCCDDEEFF"
            source: "127.0.0.3"
            secret: "molecule-unassigned-secret-2026"
            attributes:
              Service-Type: "Call-Check"
              NAS-Port-Type: "Ethernet"
              Calling-Station-Id: "aabb.ccdd.eeff"
            response: "Access-Reject"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify ../resources/playbooks/verify_restore.yml"
    - "destroy"
  name: "default"
platforms:
  - name: "freeradius"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "radius_servers"
    capabilities:
      - "SYS_ADMIN"
    security_opts:
      - "label=disable"
  - name: "freeradius-accounting-db"
    image: "docker.io/library/postgres:16-alpine"
    pre_build_image: true
    override_command: false
    network: "freeradius-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "accounting_database"
    env:
      POSTGRES_PASSWORD: "molecule-postgresql-secret-2026"
