---
# role: freeradius
# file: molecule/session_limits/verify.yml

- name: FREERADIUS | Load RADIUS service settings
  hosts: radius_servers
  gather_facts: true
  tasks:
    - name: FREERADIUS | Load platform settings for verification
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"
  gather_subset:
    - min

- name: FREERADIUS | Coordinate database outage across the fixture and RADIUS hosts
  hosts: radius_servers:accounting_database
  gather_facts: false
  strategy: linear
  tasks:
    - name: FREERADIUS | Buffer requests while PostgreSQL is stopped
      block:
        - name: FREERADIUS | Stop database fixture
          containers.podman.podman_container:
            name: "{{ inventory_hostname }}"
            state: stopped
          delegate_to: localhost
          when: "'accounting_database' in group_names"

        - name: FREERADIUS | Exercise RADIUS admission during the shared database outage
          when: "'radius_servers' in group_names"
          block:
            - name: FREERADIUS | Restart RADIUS without a database connection
              become: true
              become_user: root
              ansible.builtin.service:
                name: "{{ __freeradius_service }}"
                state: restarted

            - name: FREERADIUS | Acknowledge accounting during database outage
              ansible.builtin.command:
                argv:
                  - radclient
                  - -x
                  - -r
                  - '1'
                  - -t
                  - '3'
                  - "127.0.0.1:{{ __freeradius_case.port | default(1813) }}"
                  - acct
                  - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
                stdin: "{{ __freeradius_case.request }}"
              loop:
                - name: outage-session / Start
                  request: |
                    User-Name = "molecule"
                    Acct-Status-Type = Start
                    Acct-Session-Id = "outage-session"
                    NAS-Identifier = "molecule"
                    NAS-Port = 1
                    Acct-Session-Time = 60
                    Acct-Input-Octets = 1234
                    Acct-Input-Gigawords = 1
                    Acct-Output-Octets = 5678
                    Acct-Delay-Time = 10
                    NAS-IP-Address = 127.0.0.1
                  response: Accounting-Response
              loop_control:
                loop_var: __freeradius_case
                label: "{{ __freeradius_case.name }}"
              changed_when: false
              register: __freeradius_response
              failed_when: __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr)

            - name: FREERADIUS | Verify admission cases for the current configuration
              ansible.builtin.command:
                argv:
                  - radclient
                  - -x
                  - -r
                  - '1'
                  - -t
                  - '3'
                  - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
                  - auth
                  - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
                stdin: "{{ __freeradius_case.request }}"
              loop:
                - name: molecule / Access-Reject
                  request: |
                    User-Name = "molecule"
                    User-Password = "molecule-password"
                    Message-Authenticator = 0x00
                    Service-Type = "Framed-User"
                    Framed-Protocol = "PPP"
                  response: Access-Reject
                  reply: []
                - name: AABBCCDDEEFF / Access-Accept
                  request: |
                    User-Name = "AABBCCDDEEFF"
                    User-Password = "aa:bb:cc:dd:ee:ff"
                    Message-Authenticator = 0x00
                    Service-Type = "Call-Check"
                    NAS-Port-Type = "Ethernet"
                    Calling-Station-Id = "AA-BB-CC-DD-EE-FF"
                  response: Access-Accept
                  reply:
                    - Tunnel-Type:0 = VLAN
                    - Tunnel-Medium-Type:0 = IEEE-802
                    - Tunnel-Private-Group-Id:0 = "300"
                    - Session-Timeout = 600
                    - Idle-Timeout = 120
              loop_control:
                loop_var: __freeradius_case
                label: "{{ __freeradius_case.name }}"
              changed_when: false
              register: __freeradius_response
              failed_when: |-
                __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
                (__freeradius_case.reply | difference(__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim')) | length > 0) or
                (__freeradius_case.reply | length == 0 and __freeradius_response.stdout.split('Received ')[-1] is
                 search('(?m)^\s*(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout)'))
      always:
        - name: FREERADIUS | Restore database fixture
          containers.podman.podman_container:
            name: "{{ inventory_hostname }}"
            state: started
          delegate_to: localhost
          when: "'accounting_database' in group_names"

- name: FREERADIUS | Verify replay and session admission after database recovery
  hosts: radius_servers
  gather_facts: false
  module_defaults:
    community.postgresql.postgresql_query:
      login_host: "{{ freeradius_postgresql_host }}"
      login_user: "{{ freeradius_postgresql_user }}"
      login_password: "{{ freeradius_postgresql_password }}"
      login_db: "{{ freeradius_postgresql_database }}"
      ssl_mode: disable
  tasks:
    - name: FREERADIUS | Wait for replayed accounting after database recovery
      community.postgresql.postgresql_query:
        query: SELECT count(*) AS sessions FROM radacct WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
      register: __freeradius_sql_recovered
      until: __freeradius_sql_recovered is succeeded and __freeradius_sql_recovered.query_result[0].sessions == 1
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify Simultaneous-Use rejects another login
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Reject
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | difference(__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim')) | length > 0) or
        (__freeradius_case.reply | length == 0 and __freeradius_response.stdout.split('Received ')[-1] is
         search('(?m)^\s*(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout)'))

    - name: FREERADIUS | Age the open session beyond the configured ten-minute window
      community.postgresql.postgresql_query:
        query: |-
          UPDATE radacct SET acctstarttime = CURRENT_TIMESTAMP - INTERVAL '11 minutes',
              acctupdatetime = CURRENT_TIMESTAMP - INTERVAL '11 minutes'
          WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL

    - name: FREERADIUS | Verify a stale session permits a new login
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Accept
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | difference(__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim')) | length > 0) or
        (__freeradius_case.reply | length == 0 and __freeradius_response.stdout.split('Received ')[-1] is
         search('(?m)^\s*(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout)'))

    - name: FREERADIUS | Refresh the open session with an interim update
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1813) }}"
          - acct
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: outage-session / Interim-Update
          request: |
            User-Name = "molecule"
            Acct-Status-Type = Interim-Update
            Acct-Session-Id = "outage-session"
            NAS-Identifier = "molecule"
            NAS-Port = 1
            Acct-Session-Time = 60
            Acct-Input-Octets = 1234
            Acct-Input-Gigawords = 1
            Acct-Output-Octets = 5678
            Acct-Delay-Time = 10
            NAS-IP-Address = 127.0.0.1
          response: Accounting-Response
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr)

    - name: FREERADIUS | Wait for SQL session refresh
      community.postgresql.postgresql_query:
        query: |-
          SELECT count(*) AS sessions FROM radacct WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
            AND acctupdatetime > acctstarttime
      register: __freeradius_sql_refreshed
      until: __freeradius_sql_refreshed.query_result[0].sessions == 1
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify the refreshed session again denies admission
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Reject
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Reject
          reply: []
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | difference(__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim')) | length > 0) or
        (__freeradius_case.reply | length == 0 and __freeradius_response.stdout.split('Received ')[-1] is
         search('(?m)^\s*(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout)'))

    - name: FREERADIUS | Close the recovered session
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1813) }}"
          - acct
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: outage-session / Stop
          request: |
            User-Name = "molecule"
            Acct-Status-Type = Stop
            Acct-Session-Id = "outage-session"
            NAS-Identifier = "molecule"
            NAS-Port = 1
            Acct-Session-Time = 60
            Acct-Input-Octets = 1234
            Acct-Input-Gigawords = 1
            Acct-Output-Octets = 5678
            Acct-Delay-Time = 10
            NAS-IP-Address = 127.0.0.1
          response: Accounting-Response
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr)

    - name: FREERADIUS | Wait for SQL session closure
      community.postgresql.postgresql_query:
        query: SELECT count(*) AS sessions FROM radacct WHERE acctsessionid = 'outage-session' AND acctstoptime IS NULL
      register: __freeradius_sql_closed
      until: __freeradius_sql_closed.query_result[0].sessions == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: FREERADIUS | Verify admission resumes after session closure
      ansible.builtin.command:
        argv:
          - radclient
          - -x
          - -r
          - '1'
          - -t
          - '3'
          - "127.0.0.1:{{ __freeradius_case.port | default(1812) }}"
          - auth
          - "{{ __freeradius_case.secret | default('molecule-radius-secret-2026') }}"
        stdin: "{{ __freeradius_case.request }}"
      loop:
        - name: molecule / Access-Accept
          request: |
            User-Name = "molecule"
            User-Password = "molecule-password"
            Message-Authenticator = 0x00
            Service-Type = "Framed-User"
            Framed-Protocol = "PPP"
          response: Access-Accept
          reply:
            - Mikrotik-Group = "vpn-staff"
            - Framed-Pool = "vpn-pool"
            - Filter-Id = "vpn-filter"
            - Session-Timeout = 3600
            - Idle-Timeout = 600
      loop_control:
        loop_var: __freeradius_case
        label: "{{ __freeradius_case.name }}"
      changed_when: false
      register: __freeradius_response
      failed_when: |-
        __freeradius_case.response not in (__freeradius_response.stdout ~ __freeradius_response.stderr) or
        (__freeradius_case.reply | difference(__freeradius_response.stdout.split('Received ')[-1].splitlines() | map('trim')) | length > 0) or
        (__freeradius_case.reply | length == 0 and __freeradius_response.stdout.split('Received ')[-1] is
         search('(?m)^\s*(Mikrotik-|Tunnel-|Framed-Pool|Filter-Id|Session-Timeout|Idle-Timeout)'))
