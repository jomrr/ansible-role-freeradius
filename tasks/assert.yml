---
# role: freeradius
# file: tasks/assert.yml

- name: FREERADIUS | Validate listener and unique identities
  ansible.builtin.assert:
    that:
      - freeradius_listen_address is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\Z')
      - freeradius_port >= 1
      - freeradius_port <= 65535
      - freeradius_accounting_port >= 1
      - freeradius_accounting_port <= 65535
      - not freeradius_accounting_enabled or freeradius_accounting_port != freeradius_port
      - freeradius_accounting_backend != 'postgresql' or freeradius_accounting_enabled
      - not freeradius_postgresql_initialize_schema or freeradius_accounting_backend == 'postgresql'
      - freeradius_simultaneous_use >= 0
      - freeradius_simultaneous_use == 0 or freeradius_accounting_backend == 'postgresql'
      - freeradius_failure_limit >= 1
      - freeradius_failure_limit <= 1000
      - freeradius_failure_window >= 10
      - freeradius_failure_window <= 86400
      - freeradius_clients | map(attribute='name') | unique | length == freeradius_clients | length
      - freeradius_users | map(attribute='name') | unique | length == freeradius_users | length
    quiet: true

- name: FREERADIUS | Require PostgreSQL connection inputs for SQL accounting
  ansible.builtin.assert:
    that:
      - freeradius_postgresql_host is defined
      - freeradius_postgresql_password is defined
    quiet: true
  when: freeradius_accounting_backend == 'postgresql'

- name: FREERADIUS | Validate PostgreSQL connection syntax
  ansible.builtin.assert:
    that:
      - freeradius_postgresql_host is match('^[A-Za-z0-9_.:-]+\Z')
      - freeradius_postgresql_database is match('^[A-Za-z0-9_-]+\Z')
      - freeradius_postgresql_user is match('^[A-Za-z0-9_-]+\Z')
      - freeradius_postgresql_port >= 1
      - freeradius_postgresql_port <= 65535
      - freeradius_postgresql_ssl_root_cert == '' or freeradius_postgresql_ssl_root_cert is match('^/[A-Za-z0-9_./-]+\Z')
    quiet: true
  when: freeradius_accounting_backend == 'postgresql'

- name: FREERADIUS | Validate PostgreSQL password literal syntax
  ansible.builtin.assert:
    that:
      - freeradius_postgresql_password is match('^[A-Za-z0-9._~!@#%^&*+=:/?-]{16,128}\Z')
    quiet: true
  when: freeradius_accounting_backend == 'postgresql'
  no_log: true

- name: FREERADIUS | Require EAP-TLS certificate inputs
  ansible.builtin.assert:
    that:
      - freeradius_eap_tls_certificate_file is defined
      - freeradius_eap_tls_private_key_file is defined
      - freeradius_eap_tls_ca_file is defined
      - freeradius_eap_tls_issuer is defined
    quiet: true
  when: freeradius_eap_tls_enabled

- name: FREERADIUS | Validate EAP-TLS trust and revocation settings
  ansible.builtin.assert:
    that:
      - freeradius_eap_tls_certificate_file is match('^/[A-Za-z0-9_./-]+\Z')
      - freeradius_eap_tls_private_key_file is match('^/[A-Za-z0-9_./-]+\Z')
      - freeradius_eap_tls_ca_file is match('^/[A-Za-z0-9_./-]+\Z')
      - freeradius_eap_tls_issuer is match('^/[A-Za-z0-9 /.,=@_+-]+\Z')
      - freeradius_eap_tls_revocation != 'crl' or freeradius_eap_tls_ca_path is match('^/[A-Za-z0-9_./-]+\Z')
      - freeradius_eap_tls_revocation != 'ocsp' or freeradius_eap_tls_ocsp_url is match('^http://[A-Za-z0-9.:/_?-]+\Z')
      - freeradius_eap_tls_vlan_policies | length > 0
      - freeradius_eap_tls_vlan_policies | map(attribute='oid') | unique | length == freeradius_eap_tls_vlan_policies | length
    quiet: true
  when: freeradius_eap_tls_enabled

- name: FREERADIUS | Validate EAP-TLS VLAN policy mappings
  ansible.builtin.assert:
    that:
      - __freeradius_policy.oid is match('^(0\.[0-3]?[0-9]|1\.[0-3]?[0-9]|2\.(0|[1-9][0-9]*))(\.(0|[1-9][0-9]*))+\Z')
      - __freeradius_policy.vlan_id >= 1
      - __freeradius_policy.vlan_id <= 4094
    quiet: true
  loop: "{{ freeradius_eap_tls_vlan_policies }}"
  loop_control:
    loop_var: __freeradius_policy
    label: "{{ __freeradius_policy.oid }}"

- name: FREERADIUS | Validate EAP-TLS private key password literal
  ansible.builtin.assert:
    that:
      - freeradius_eap_tls_private_key_password is match('^[A-Za-z0-9._~!@#^&*+=:/?-]*\Z')
    quiet: true
  when: freeradius_eap_tls_enabled
  no_log: true

- name: FREERADIUS | Validate client identifiers
  ansible.builtin.assert:
    that:
      - __freeradius_client_name is match('^[A-Za-z0-9_-]+\Z')
    quiet: true
  loop: "{{ freeradius_clients | map(attribute='name') }}"
  loop_control:
    loop_var: __freeradius_client_name
    label: "{{ __freeradius_client_name }}"

- name: FREERADIUS | Validate client network syntax
  ansible.builtin.assert:
    that:
      - __freeradius_client_address is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/([1-9]|[12][0-9]|3[0-2]))?\Z')
    quiet: true
  loop: "{{ freeradius_clients | map(attribute='address') }}"
  loop_control:
    loop_var: __freeradius_client_address
    label: "{{ __freeradius_client_address }}"

- name: FREERADIUS | Require a distinct shared secret for each client
  ansible.builtin.assert:
    that:
      - freeradius_clients | map(attribute='secret') | unique(case_sensitive=true) | length == freeradius_clients | length
    quiet: true
  no_log: true

- name: FREERADIUS | Validate shared secret length and literal syntax
  ansible.builtin.assert:
    that:
      - __freeradius_client.secret is match('^[A-Za-z0-9._~!@#%^&*+=:/?-]{16,128}\Z')
    quiet: true
  loop: "{{ freeradius_clients }}"
  loop_control:
    loop_var: __freeradius_client
    label: "{{ __freeradius_client.name }}"
  no_log: true

- name: FREERADIUS | Validate local usernames
  ansible.builtin.assert:
    that:
      - __freeradius_username is match('^[A-Za-z0-9_.@-]+\Z')
      - __freeradius_username != 'DEFAULT'
    quiet: true
  loop: "{{ freeradius_users | map(attribute='name') }}"
  loop_control:
    loop_var: __freeradius_username
    label: "{{ __freeradius_username }}"

- name: FREERADIUS | Validate credentials against the selected password attribute
  ansible.builtin.assert:
    that:
      - >-
        __freeradius_account.password is match(
          __freeradius_password_patterns[__freeradius_account.password_attribute | default(freeradius_password_attribute)])
    quiet: true
  loop: "{{ freeradius_users }}"
  loop_control:
    loop_var: __freeradius_account
    label: "{{ __freeradius_account.name }}"
  no_log: true

- name: FREERADIUS | Validate authorization prerequisites
  ansible.builtin.assert:
    that:
      - not freeradius_mab_enabled or freeradius_authorization_enabled
      - freeradius_access_profiles | map(attribute='name') | unique | length == freeradius_access_profiles | length
      - >-
        freeradius_mab_devices | map(attribute='mac') | map('regex_replace', '[-:.]', '') | map('lower') | unique | length
        == freeradius_mab_devices | length
    quiet: true

- name: FREERADIUS | Validate access profile constraints
  ansible.builtin.assert:
    that:
      - __freeradius_profile.name is match('^[A-Za-z0-9_-]+\Z')
      - __freeradius_profile.kind != 'mab' or __freeradius_profile.vlan_id is defined
      - __freeradius_profile.kind != 'vpn' or __freeradius_profile.vlan_id is not defined
      - >-
        __freeradius_profile.kind != 'mab' or
        (__freeradius_profile.mikrotik_group is not defined and __freeradius_profile.framed_pool is not defined
        and __freeradius_profile.filter_id is not defined)
      - __freeradius_profile.vlan_id is not defined or (1 <= __freeradius_profile.vlan_id <= 4094)
      - __freeradius_profile.session_timeout is not defined or (1 <= __freeradius_profile.session_timeout <= 4294967295)
      - __freeradius_profile.idle_timeout is not defined or (1 <= __freeradius_profile.idle_timeout <= 4294967295)
      - __freeradius_profile.mikrotik_group is not defined or __freeradius_profile.mikrotik_group is match('^[A-Za-z0-9_. /:@+-]+\Z')
      - __freeradius_profile.framed_pool is not defined or __freeradius_profile.framed_pool is match('^[A-Za-z0-9_. /:@+-]+\Z')
      - __freeradius_profile.filter_id is not defined or __freeradius_profile.filter_id is match('^[A-Za-z0-9_. /:@+-]+\Z')
    quiet: true
  loop: "{{ freeradius_access_profiles }}"
  loop_control:
    loop_var: __freeradius_profile
    label: "{{ __freeradius_profile.name }}"

- name: FREERADIUS | Require a service discriminator for MAB clients
  ansible.builtin.assert:
    that:
      - "'mab' not in __freeradius_services"
    quiet: true
  loop: "{{ freeradius_clients | rejectattr('mab_service_type', 'defined') | map(attribute='services', default=[]) }}"
  loop_control:
    loop_var: __freeradius_services

- name: FREERADIUS | Require the MAB quarantine profile
  ansible.builtin.assert:
    that:
      - freeradius_mab_quarantine_profile is defined
      - freeradius_mab_quarantine_profile in freeradius_access_profiles | selectattr('kind', 'equalto', 'mab') | map(attribute='name')
    quiet: true
  when: freeradius_mab_enabled

- name: FREERADIUS | Validate MAC device syntax
  ansible.builtin.assert:
    that:
      - >-
        __freeradius_mac is match('(?i)^([0-9a-f]{12}|([0-9a-f]{2}:){5}[0-9a-f]{2}|([0-9a-f]{2}-){5}[0-9a-f]{2}|([0-9a-f]{4}\.){2}[0-9a-f]{4})\Z')
    quiet: true
  loop: "{{ freeradius_mab_devices | map(attribute='mac') }}"
  loop_control:
    loop_var: __freeradius_mac

- name: FREERADIUS | Require unique client grants per identity
  ansible.builtin.assert:
    that:
      - __freeradius_access | map(attribute='client') | unique | length == __freeradius_access | length
    quiet: true
  loop: >-
    {{ (freeradius_users | map(attribute='access', default=[]) | list)
       + (freeradius_mab_devices | map(attribute='access', default=[]) | list) }}
  loop_control:
    loop_var: __freeradius_access

- name: FREERADIUS | Validate VPN grant references
  ansible.builtin.assert:
    that:
      - __freeradius_grant.profile in freeradius_access_profiles | selectattr('kind', 'equalto', 'vpn') | map(attribute='name')
      - >-
        __freeradius_grant.client in freeradius_clients | selectattr('services', 'defined')
        | selectattr('services', 'contains', 'vpn') | map(attribute='name')
    quiet: true
  loop: "{{ freeradius_users | map(attribute='access', default=[]) | flatten }}"
  loop_control:
    loop_var: __freeradius_grant
    label: "{{ __freeradius_grant.client }}:{{ __freeradius_grant.profile }}"

- name: FREERADIUS | Validate MAB grant references
  ansible.builtin.assert:
    that:
      - __freeradius_grant.profile in freeradius_access_profiles | selectattr('kind', 'equalto', 'mab') | map(attribute='name')
      - >-
        __freeradius_grant.client in freeradius_clients | selectattr('services', 'defined')
        | selectattr('services', 'contains', 'mab') | map(attribute='name')
    quiet: true
  loop: "{{ freeradius_mab_devices | map(attribute='access', default=[]) | flatten }}"
  loop_control:
    loop_var: __freeradius_grant
    label: "{{ __freeradius_grant.client }}:{{ __freeradius_grant.profile }}"
