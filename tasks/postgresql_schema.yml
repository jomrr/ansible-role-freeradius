---
# role: freeradius
# file: tasks/postgresql_schema.yml

- name: FREERADIUS | Install PostgreSQL schema management adapter
  become: true
  become_user: root
  ansible.builtin.package:
    name: python3-psycopg2
    state: present

- name: FREERADIUS | Manage accounting schema with the owner identity
  module_defaults:
    group/community.postgresql.all:
      login_host: "{{ freeradius_postgresql_host }}"
      login_port: "{{ freeradius_postgresql_port }}"
      login_db: "{{ freeradius_postgresql_database }}"
      login_user: "{{ freeradius_postgresql_schema_user }}"
      login_password: "{{ freeradius_postgresql_schema_password }}"
      ssl_mode: "{{ freeradius_postgresql_ssl_mode }}"
      ca_cert: "{{ freeradius_postgresql_ssl_root_cert or omit }}"
  block:
    - name: FREERADIUS | Inspect accounting ownership and runtime privileges
      become: true
      become_user: root
      community.postgresql.postgresql_query:
        query: >-
          SELECT c.oid IS NOT NULL AS initialized, pg_get_userbyid(c.relowner) AS table_owner,
                 pg_get_userbyid(seq.relowner) AS sequence_owner,
                 EXISTS (SELECT 1 FROM pg_roles elevated
                         WHERE (elevated.rolsuper OR elevated.rolcreaterole OR elevated.rolcreatedb
                                OR elevated.rolreplication OR elevated.rolbypassrls)
                           AND pg_has_role(r.oid, elevated.oid, 'MEMBER')) AS privileged,
                 pg_has_role(r.oid, current_user, 'MEMBER') AS owner_member,
                 pg_has_role(r.oid, d.datdba, 'MEMBER') AS database_owner,
                 pg_has_role(r.oid, n.nspowner, 'MEMBER') AS schema_owner,
                 has_database_privilege(r.oid, d.oid, 'CREATE') AS database_create,
                 has_schema_privilege(r.oid, n.oid, 'CREATE') AS schema_create,
                 COALESCE(has_table_privilege(r.oid, c.oid,
                   'DELETE,TRUNCATE,REFERENCES,TRIGGER,SELECT WITH GRANT OPTION,INSERT WITH GRANT OPTION,UPDATE WITH GRANT OPTION'),
                   false) AS excess_table_privileges,
                 COALESCE(has_sequence_privilege(r.oid, seq.oid,
                   'SELECT,UPDATE,USAGE WITH GRANT OPTION'), false) AS excess_sequence_privileges
          FROM pg_roles r
          JOIN pg_database d ON d.datname = current_database()
          JOIN pg_namespace n ON n.nspname = 'public'
          LEFT JOIN pg_class c ON c.oid = to_regclass('public.radacct')
          LEFT JOIN pg_class seq ON seq.oid = to_regclass('public.radacct_radacctid_seq')
          WHERE r.rolname = %(runtime_user)s
        named_args:
          runtime_user: "{{ freeradius_postgresql_user }}"
      register: __freeradius_postgresql_schema
      changed_when: false
      no_log: true

    - name: FREERADIUS | Require an unprivileged runtime login and separate schema owner
      ansible.builtin.assert:
        that:
          - __freeradius_postgresql_schema.query_result | length == 1
          - not __freeradius_postgresql_schema.query_result[0].privileged
          - not __freeradius_postgresql_schema.query_result[0].owner_member
          - not __freeradius_postgresql_schema.query_result[0].database_owner
          - not __freeradius_postgresql_schema.query_result[0].schema_owner
          - not __freeradius_postgresql_schema.query_result[0].database_create
          - not __freeradius_postgresql_schema.query_result[0].schema_create
          - not __freeradius_postgresql_schema.query_result[0].excess_table_privileges
          - not __freeradius_postgresql_schema.query_result[0].excess_sequence_privileges
          - >-
            not __freeradius_postgresql_schema.query_result[0].initialized or
            __freeradius_postgresql_schema.query_result[0].table_owner == freeradius_postgresql_schema_user
          - >-
            not __freeradius_postgresql_schema.query_result[0].initialized or
            __freeradius_postgresql_schema.query_result[0].sequence_owner == freeradius_postgresql_schema_user
        fail_msg: >-
          Pre-create a restricted runtime login without owner membership, administrative or CREATE privileges.
          Existing radacct and sequence ownership must belong to freeradius_postgresql_schema_user;
          migrate ownership and remove excess runtime privileges with a database administrator first.
        quiet: true

    - name: FREERADIUS | Import distribution PostgreSQL schema as owner
      become: true
      become_user: root
      community.postgresql.postgresql_script:
        path: "{{ __freeradius_config_dir }}/mods-config/sql/main/postgresql/schema.sql"
      when: not __freeradius_postgresql_schema.query_result[0].initialized
      no_log: true

    - name: FREERADIUS | Grant required accounting privileges to the runtime login
      become: true
      become_user: root
      community.postgresql.postgresql_privs:
        type: "{{ __freeradius_postgresql_grant.type }}"
        objs: "{{ __freeradius_postgresql_grant.object }}"
        privs: "{{ __freeradius_postgresql_grant.privileges }}"
        roles: "{{ freeradius_postgresql_user }}"
        grant_option: false
        state: present
      loop:
        - {type: schema, object: public, privileges: USAGE}
        - {type: table, object: radacct, privileges: 'SELECT,INSERT,UPDATE'}
        - {type: sequence, object: radacct_radacctid_seq, privileges: USAGE}
      loop_control:
        loop_var: __freeradius_postgresql_grant
        label: "{{ __freeradius_postgresql_grant.object }}"
      no_log: true
